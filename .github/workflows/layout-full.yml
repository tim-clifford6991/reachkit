# The full layout matrix — six widths, three bands, both themes.
#
# The merge gate walks one band (issue #545); this is where the rest of the
# matrix is still walked, nightly, so a width or band the gate does not
# reach cannot drift unseen. Not a merge gate: it reports.
name: Layout (full matrix)

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

concurrency:
  group: layout-full
  cancel-in-progress: false

jobs:
  full:
    name: layout conformance — full matrix
    runs-on: [self-hosted, reachkit]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/layout-suite
      - run: npm run test:layout:full
      - if: always()
        uses: ./.github/actions/db-substrate-down

