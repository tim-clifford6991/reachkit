# Every CI job on `main`, every night, with nothing skipped (owner, 2026-10-18,
# #1525; C1 and C3, 2026-10-19). A pull request runs only the unit tests its
# change reaches, `schema · RLS` only where the database can change, and half
# the sweep's cases (`scripts/ci-changes.mjs`); this run is the net under those
# skips. It calls `ci.yml`, which off a pull request runs the full unit suite,
# the database job and every width in both themes.
#
# It is not a merge gate and nothing waits on it: a red run opens one issue
# titled `[nightly] full run on main is red`, or comments on the open one, and
# an engineer starts from that issue. Every job runs GitHub-hosted, as on a
# pull request (owner, 2026-10-22: the repository is public).
name: Nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print what the issue step would do, and file nothing
        type: boolean
        default: false

concurrency:
  group: layout-nightly
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  report:
    name: open or comment on the [nightly] issue
    needs: ci
    if: ${{ failure() || inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY: ${{ inputs.dry_run && '1' || '' }}
          RESULT: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[nightly] full run on main is red"
          body="The nightly run of every CI job on main (${GITHUB_SHA::7}) failed: $RUN_URL. The failing job's log names the test, or the element, screen, width and theme."
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then set -- gh issue comment "$open" --body "$body"; else set -- gh issue create --title "$title" --body "$body"; fi
          if [ -n "$DRY" ]; then echo "dry run (ci: $RESULT), would run: $*"; else "$@"; fi
