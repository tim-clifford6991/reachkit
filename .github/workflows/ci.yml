# Required on main: typecheck · lint · unit, audit, schema · RLS, and — since
# the owner's ruling of 2026-09-21 closing #910 — no overflow · axe.
# Every job here reports on every pull request. Nothing runs only on `main`:
# a check whose findings arrive after the merge is a check nobody can act on,
# which is how the two browser jobs this one absorbed came to be red for days
# without anybody seeing it (#976). No pixel baseline blocks a merge, and none
# is kept (docs/DESIGN.md, docs/PROCESS.md). Nor does anything run again on
# the push to `main` a merge makes: those jobs already ran on the pull request,
# and a result that arrives after the merge cannot stop it (2026-09-24, #1052).
#
# Every job runs on `reachkit-box`, the self-hosted runner on the shared box
# (owner, 2026-09-22, #1013): the same checks, no GitHub-hosted minutes. It
# is one runner, so jobs queue behind each other, and each has a timeout so a
# hung one cannot hold it.
name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **What the pull request changed** (owner, 2026-09-24, #1053). A pull
  # request whose files are all under `docs/`, or are markdown (`*.md`,
  # `CLAUDE.md`) outside `src/`, `tests/`, `supabase/`, `.github/` and
  # `scripts/`, needs only `audit` (drift-audit.yml), which is the job that
  # reads the documents. The three jobs below then report *skipped*, which
  # the merge reads as passed, rather than holding the one runner for about
  # 25 minutes. Any other file — code, tests, migrations, workflows,
  # scripts, `package.json`, `package-lock.json`, config — runs all four.
  #
  # The list is of what may skip, so a file nobody thought of runs
  # everything. The diff is the merge commit against its first parent, the
  # base branch as the pull request would land on it. A run that is not a
  # pull request, and a filter that fails, run everything too: the jobs
  # below skip only on an explicit `false`.
  changes:
    name: what changed
    runs-on: [self-hosted, reachkit]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only HEAD^1 HEAD)
          code=false
          [ -z "$files" ] && code=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              src/*|tests/*|supabase/*|.github/*|scripts/*) kind=code ;;
              docs/*|*.md) kind=docs ;;
              *) kind=code ;;
            esac
            echo "$kind  $f"
            [ "$kind" = code ] && code=true
          done <<< "$files"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: typecheck · lint · unit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: [self-hosted, reachkit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run --project node --project ui

  no-overflow:
    name: no overflow · axe (390 / 768 / 1280, light and dark)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: [self-hosted, reachkit]
    timeout-minutes: 45
    # **The fourth merge gate** (owner's ruling of 2026-09-21, closing #910;
    # `docs/PROCESS.md`'s Gates table is where it is written down), and the
    # one browser job there is.
    #
    # Until 2026-09-21 two more ran, on `main` only: `layout conformance
    # (browser)` and `review gallery`. They had been red since before the
    # redesign and nobody could see it, because a job that runs only after a
    # merge is a job whose findings arrive too late to act on and whose fix
    # cannot be tried before it lands (#976). The owner's ruling was to fold
    # what those two still said something true about into this job and
    # retire the rest — so this job now runs the whole `layout` project and
    # there is no second browser job:
    #
    #   folded in — the checks-1-to-5 route sweep, the eyebrow rung, the
    #     heading scale, the live and week-0 accounts, Settings with a field
    #     open, the current Settings tab being on screen, the security
    #     headers, the theme slots and the values. Everything but the
    #     web-vitals budget, for the reason the step below states.
    #   retired — the committed PNG baselines and the review gallery, with
    #     the `regen-baselines` workflow and the side-by-side comment that
    #     served them. `docs/DESIGN.md` forbids a pixel baseline as a merge
    #     gate, and the owner reviews the product on `dev.reachkit.app`.
    #
    # **And since #988 it carries the landing's script budget too.** That
    # was the one subtraction left — `test:layout:gate` was `test:layout`
    # minus `vitals.test.ts`, because `main` breached the budget by 130 kB
    # and folding it in would have blocked every merge over a defect no PR
    # introduced. `/` is inside the budget now, so the subtraction is gone
    # and so is the script that expressed it: this job runs the whole
    # `layout` project, which is what #988's third `Done when` asks for.
    #
    # Nothing here photographs anything. Every failure it can produce is a
    # sentence naming an element on a named screen at a named width in a
    # named theme, which is what makes it fit to block a merge.
    #
    # **Where the data comes from.**
    # `scripts/db-substrate/up.sh --run` against the box's own PostgreSQL 18,
    # in a database of this job's own (#1013), with `tests/ui/layout/seed.ts`
    # applying the migrations and seeding the four accounts, and
    # `tests/ui/layout/auth-stub.ts` answering `getUser()` — the substrate
    # has no GoTrue. Nothing reaches a vendor.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/layout-suite
      # The whole `layout` project, the landing's script budget included
      # (#988).
      - name: every screen, hydrated — no overflow, axe, the five checks
        run: npm run test:layout
      - if: always()
        uses: ./.github/actions/db-substrate-down

  db:
    name: schema · RLS (live Postgres)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: [self-hosted, reachkit]
    timeout-minutes: 25
    # The `db` project asserts the schema against a live, migrated database.
    # `scripts/db-substrate/` is that database and the two services around it
    # — PostgREST and postgres-meta — so this job needs no Supabase CLI and no
    # `supabase start`. The database is the box's own PostgreSQL 18 (#1013).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/db-substrate
      - run: npx vitest run --project db
      - if: always()
        uses: ./.github/actions/db-substrate-down
