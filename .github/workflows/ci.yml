# Required on main: typecheck · lint · unit, audit, schema · RLS, and — since
# the owner's ruling of 2026-09-21 closing #910 — no overflow · axe.
# Every job here reports on every pull request. Since the owner's ruling of
# 2026-10-18 (#1525) a report may be success with a reason: `no overflow ·
# axe` runs the sweep only where a screen can change, and otherwise passes
# with one line that says why. Nothing that can change a screen merges
# unswept: a check whose findings arrive after the merge is a check nobody
# can act on, which is how the two browser jobs this one absorbed came to be
# red for days without anybody seeing it (#976). The nightly sweep of `main`
# (`layout-nightly.yml`) is a net under the skip, not a gate. No pixel baseline blocks a merge, and none
# is kept (docs/DESIGN.md, docs/PROCESS.md). Nor does anything run again on
# the push to `main` a merge makes: those jobs already ran on the pull request,
# and a result that arrives after the merge cannot stop it (2026-09-24, #1052).
#
# **Where each job runs** (owner, 2026-10-22). The repository is public, so
# every job runs on `ubuntu-latest`: a self-hosted runner would run a fork's
# pull request on the production box. No repository variable chooses the
# runner. Every job has a timeout so a hung one cannot hold a runner.
name: CI

on:
  pull_request:
  workflow_dispatch:
  # `layout-nightly.yml` calls this on `main`, where nothing is skipped.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **What the pull request changed** (owner, 2026-09-24, #1053). A pull
  # request whose files are all under `docs/`, or are markdown (`*.md`,
  # `CLAUDE.md`) outside `src/`, `tests/`, `supabase/`, `.github/` and
  # `scripts/`, needs only `audit` (drift-audit.yml), which is the job that
  # reads the documents. The three jobs below then report *skipped*, which
  # the merge reads as passed, rather than holding the one runner for about
  # 25 minutes. Any other file — code, tests, migrations, workflows,
  # scripts, `package.json`, `package-lock.json`, config — runs all four.
  #
  # The list is of what may skip, so a file nobody thought of runs
  # everything. The diff is the merge commit against its first parent, the
  # base branch as the pull request would land on it. A run that is not a
  # pull request, and a filter that fails, run everything too: the jobs
  # below skip only on an explicit `false`.
  #
  # **Where a screen can change** (owner, 2026-10-18, #1525). The second
  # output, `ui`, is true where a path can change what a screen renders or
  # how the sweep measures it: `src/app`, `src/components`, `src/ui`,
  # `src/lib/presentation`, the middleware, any stylesheet, `public/`,
  # `tests/ui`, `package*.json`, `next.config.*`, and the sweep itself (its
  # vitest config, migrations and substrate, its actions, this file). Both
  # lists are `scripts/ci-changes.mjs`, which prints why each path counts.
  #
  # **Only what the change reaches** (owner C1 and C3, 2026-10-19). `db` is
  # true where a path can change the migrated schema or its suite; false
  # skips `schema · RLS`. `unit` is `affected` unless a path reaches tests
  # through no import; then, and off a pull request, it is `full`.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      ui: ${{ steps.filter.outputs.ui }}
      db: ${{ steps.filter.outputs.db }}
      unit: ${{ steps.filter.outputs.unit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'code=true\nui=true\ndb=true\nunit=full\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only HEAD^1 HEAD | node scripts/ci-changes.mjs

  check:
    name: typecheck · lint · unit
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # **Caches and two workers** (issue 1569). tsc is `incremental` in
      # tsconfig.json and eslint runs with `--cache`; both files are kept
      # between runs of a pull request. A checkout resets every mtime, so
      # eslint compares content, not metadata. The key carries the lockfile,
      # so a plugin upgrade starts cold. vitest runs two workers, and two
      # workers push the whole-tree scans past vitest's 5 s default.
      - uses: actions/cache@v4
        with:
          path: |
            tsconfig.tsbuildinfo
            .eslintcache
          key: check-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.run_id }}
          restore-keys: check-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run typecheck
      - run: npm run lint -- --cache --cache-strategy content
      # `--changed HEAD^1` runs the test files vitest's module graph links to
      # the merge commit's diff; `full` (or a failed filter) runs them all.
      - name: unit tests (${{ needs.changes.outputs.unit || 'full' }})
        env:
          UNIT: ${{ needs.changes.outputs.unit }}
        run: |
          if [ "$UNIT" = affected ]; then
            echo "unit=affected: only the test files the diff reaches through an import run; 'what changed' lists each path."
            set -- --changed HEAD^1
          else
            echo "unit=full: a path in the diff reaches tests through no import, or this is not a pull request; 'what changed' tags it 'full'."
          fi
          npx vitest run --project node --project ui --maxWorkers=2 --testTimeout=20000 "$@"

  no-overflow:
    name: no overflow · axe (390 / 768 / 1280, light and dark)
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The sweep's PostgreSQL 18 is this service, as in `db`; where no screen
    # can change the image is empty and no container starts.
    services:
      postgres:
        image: ${{ needs.changes.outputs.ui != 'false' && 'postgres:18' || '' }}
        env:
          POSTGRES_USER: reachkit
          POSTGRES_PASSWORD: reachkit
          POSTGRES_DB: reachkit_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reachkit -d reachkit_scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # **The fourth merge gate** (owner's ruling of 2026-09-21, closing #910;
    # `docs/PROCESS.md`'s Gates table is where it is written down), and the
    # one browser job there is. It runs the whole `layout` project: the
    # route sweep, the eyebrow rung, the heading scale, the live and week-0
    # accounts, Settings with a field open, the current Settings tab on
    # screen, the security headers, the theme slots and the values, and the
    # landing's script budget (#988). It takes no screenshot. The owner
    # looks at `dev.reachkit.app` for taste, not as a second pass over this gate.
    #
    # Every failure it can produce is a sentence naming an element on a
    # named screen at a named width in a named theme, which is what makes
    # it fit to block a merge. Strategy that is not a layout measure
    # (titles, retired names) is tests/ui/design/strategy.test.ts in the
    # unit job, as docs/DESIGN.md states. The owner looks for taste.
    #
    # **Where the data comes from.**
    # `scripts/db-substrate/up.sh --run` against the `postgres:18` service,
    # with `tests/ui/layout/seed.ts`
    # applying the migrations and seeding the four accounts, and
    # `tests/ui/layout/auth-stub.ts` answering `getUser()` — the substrate
    # has no GoTrue. Nothing reaches a vendor.
    #
    # **Where no screen can change** (owner, 2026-10-18, #1525, amending
    # #910's "every job reports on every pull request"). It still reports on
    # every pull request: where `ui` is false it succeeds with one reason
    # line and runs nothing. Any path that can change a screen runs the
    # whole sweep, as before. `layout-nightly.yml` sweeps `main` every night
    # and opens an issue when it is red.
    steps:
      - name: no screen can change — the sweep is not needed
        if: ${{ needs.changes.outputs.ui == 'false' }}
        run: |
          line="No path in this pull request can change a screen (scripts/ci-changes.mjs, owner 2026-10-18, #1525). The sweep did not run; the nightly run on main sweeps every screen."
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ needs.changes.outputs.ui != 'false' }}
        uses: actions/checkout@v4
      - if: ${{ needs.changes.outputs.ui != 'false' }}
        uses: ./.github/actions/layout-suite
      # The whole `layout` project, the landing's script budget included
      # (#988).
      # A pull request sweeps each width in one theme (`noOverflowCasesFor`).
      - name: every screen, hydrated — no overflow, axe, the five checks
        if: ${{ needs.changes.outputs.ui != 'false' }}
        env:
          RK_LAYOUT_PR: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npm run test:layout
      - if: ${{ always() && needs.changes.outputs.ui != 'false' }}
        uses: ./.github/actions/db-substrate-down

  db:
    name: schema · RLS (live Postgres)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.db != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The `db` project asserts the schema against a live, migrated database.
    # `scripts/db-substrate/` is that database and the two services around it
    # — PostgREST and postgres-meta — so this job needs no Supabase CLI and no
    # `supabase start`. The PostgreSQL 18 is this job's own `postgres:18`
    # service, `up.sh` starts PostgREST in Docker and installs postgres-meta
    # from npm.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: reachkit
          POSTGRES_PASSWORD: reachkit
          POSTGRES_DB: reachkit_scratch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reachkit -d reachkit_scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/db-substrate
      - run: npx vitest run --project db
      - if: always()
        uses: ./.github/actions/db-substrate-down
