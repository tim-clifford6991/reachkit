name: CI
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
jobs:
  # Inngest Cloud auto-sync-on-deploy has silently gone stale TWICE
  # (2026-07-08 pre-launch, 2026-07-15 after P4's onFailure edits) — newer
  # functions just drop out of Cloud with no error anywhere. This job makes
  # the documented manual fix (PUT /api/inngest) automatic: after every push
  # to main it waits for prod to actually serve the new commit, then forces a
  # re-registration and asserts it succeeded. Failing loudly here (prod never
  # picked up the commit, or the PUT errored) is the desired signal.
  inngest-sync:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — needed for the superseded-deploy ancestry check
      - name: Wait for prod to serve this commit, then force Inngest re-sync
        run: |
          LIVE=""
          for i in $(seq 1 60); do
            LIVE=$(curl -sf https://reachkit.app/api/health | jq -r .commit || echo "")
            [ "$LIVE" = "${GITHUB_SHA::7}" ] && break
            # Back-to-back merges make Vercel skip intermediate builds: prod
            # jumps straight to a NEWER commit and this sha never ships. That
            # is success, not failure (the 2026-07-16 merge chain failed 2 of
            # 3 runs this way) — detect it via ancestry and sync anyway.
            if [ -n "$LIVE" ] && git cat-file -e "$LIVE^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE" 2>/dev/null; then
              echo "prod serves $LIVE, which contains ${GITHUB_SHA::7} — this deploy was superseded by a newer merge; syncing against the newer deploy"
              break
            fi
            sleep 15
          done
          if [ "$LIVE" != "${GITHUB_SHA::7}" ] && ! { git cat-file -e "$LIVE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$LIVE" 2>/dev/null; }; then
            echo "::error::prod never reached ${GITHUB_SHA::7} (still serving '$LIVE') — deploy stuck or health broken"
            exit 1
          fi
          RESP=$(curl -sf -X PUT https://reachkit.app/api/inngest)
          echo "$RESP"
          echo "$RESP" | jq -e '.message == "Successfully registered"'
          # modified:true here means auto-sync HAD drifted and this PUT healed
          # it — worth seeing in the log, not a failure.
          echo "$RESP" | jq -r 'if .modified then "::warning::Inngest was stale — this sync repaired it" else "Inngest registration was already current" end'

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Architecture boundaries
        run: pnpm check:arch
      - name: Design parity
        run: pnpm check:design
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Bundle budget
        run: pnpm check:bundle
  eval-integration:
    # Golden-set eval (invariant #5's named guard) + integration tests against a
    # real local Supabase stack. Fixture mode — no API secrets required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # Pinned to the locally-verified CLI: `latest` (2.109+) starts a stack with
      # new-format sb_publishable_/sb_secret_ keys where the legacy
      # SERVICE_ROLE_KEY emitted by `status -o env` lacks service-role privileges
      # → "permission denied for table apps" in every DB-backed test. Bump this
      # pin deliberately, together with the key-mapping step below.
      - uses: supabase/setup-cli@v1
        with: { version: 2.26.9 }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies migrations)
        run: supabase start
      - name: Write test env from local stack
        # Dummy paid keys: some integration tests deliberately run with
        # REACHKIT_USE_FIXTURES=false (degraded-paths, refresh real-mode cases)
        # with every adapter mocked — env.ts's zod parse still requires the paid
        # keys to be non-empty in that mode. The values are never used.
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "REACHKIT_USE_FIXTURES=true"
            for k in ANTHROPIC_API_KEY DATAFORSEO_LOGIN DATAFORSEO_PASSWORD TAVILY_API_KEY RESEND_API_KEY PRODUCT_HUNT_TOKEN YOUTUBE_API_KEY VOYAGE_API_KEY INNGEST_SIGNING_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_SOLO STRIPE_PRICE_GROWTH; do
              echo "$k=ci-dummy-never-used"
            done
          } > .env.local
      - name: Golden-set eval
        run: pnpm eval
      - name: Integration tests
        run: pnpm test:int
  live-smoke:
    # Opt-in LIVE-mode smoke (REACHKIT_USE_FIXTURES=false). The fixture suite +
    # eval + code-review all MASK real-adapter / LLM-on-mixed-content bugs
    # (CLAUDE.md hard rule — the linear.app SPA-fetch failure was invisible to
    # fixtures). This runs the two live-only tests against real adapters.
    #
    # MANUAL ONLY (workflow_dispatch) + non-blocking (continue-on-error): it needs
    # real API secrets and spends real budget, so it must never run on push/PR.
    # To use: add the repo secrets referenced below, then run this workflow from
    # the Actions tab. Each live test self-skips if its preconditions aren't met.
    #
    # ⚠️ STRIPE_SECRET_KEY MUST BE A TEST-MODE KEY (sk_test_). The funnel test is
    # NOT read-only — it calls createAnonymousCheckout, which creates a real
    # Checkout Session in whatever account the key points at (and sends a real
    # Resend onboarding email). Pair it with a TEST-mode STRIPE_PRICE_SOLO: a live
    # price id does not resolve under a test key.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: 2.26.9 }
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies migrations)
        run: supabase start
      - name: Write live env from secrets
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY)=')"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "REACHKIT_USE_FIXTURES=false"
            echo "RUN_REFERRAL=true"
            echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
            echo "DATAFORSEO_LOGIN=${{ secrets.DATAFORSEO_LOGIN }}"
            echo "DATAFORSEO_PASSWORD=${{ secrets.DATAFORSEO_PASSWORD }}"
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}"
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}"
            echo "PRODUCT_HUNT_TOKEN=${{ secrets.PRODUCT_HUNT_TOKEN }}"
            echo "YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}"
            echo "VOYAGE_API_KEY=${{ secrets.VOYAGE_API_KEY }}"
            echo "INNGEST_SIGNING_KEY=${{ secrets.INNGEST_SIGNING_KEY }}"
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
            echo "STRIPE_PRICE_SOLO=${{ secrets.STRIPE_PRICE_SOLO }}"
            # Required-in-prod since the 2026-07-15 launch review; a TEST-mode
            # Growth price id, same rule as STRIPE_PRICE_SOLO above.
            echo "STRIPE_PRICE_GROWTH=${{ secrets.STRIPE_PRICE_GROWTH }}"
          } > .env.local
      - name: Live smoke (payment-first funnel + reverse-referral)
        run: pnpm test:int tests/integration/payment-first-funnel.test.ts tests/integration/referral-discovery.test.ts
      - name: Score calibration (band-separation measurement — the open red rule)
        # Non-enforcing measurement (Task 5.3, remediation plan 2026-07-15):
        # score calibration is still the one unresolved red rule; this makes the
        # band-separation report one click instead of a forgotten local script.
        # --http: score+band are scraped from the public /scan/<slug> <title> —
        # this job's SUPABASE_* env points at the LOCAL stack, never at the
        # target's DB. tsx is not a repo dep; npx --yes matches the
        # dev:inngest idiom. Runs even if the smoke tests above failed
        # (if: always() — the measurement is independent of them).
        if: always()
        run: npx --yes tsx scripts/score-calibration.mts --base-url=https://reachkit.app --http | tee score-calibration-report.txt
      - name: Upload score-calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-calibration-report
          path: score-calibration-report.txt
          if-no-files-found: ignore
      # Cloud-config drift tripwire (launch remediation 6.1): asserts the LIVE
      # Stripe webhook endpoint targets reachkit.app with the 4 handled events,
      # live prices resolve/active/EUR/no-trial, Inngest registration is
      # current, and prod health + the €59 pricing surface are up.
      #
      # ⚠️ This step needs a LIVE-mode key (the job's STRIPE_SECRET_KEY above is
      # deliberately sk_test_) — but a RESTRICTED read-only one:
      # STRIPE_LIVE_READONLY_KEY = Stripe Dashboard → API keys → Create
      # restricted key (read-only on Webhook Endpoints + Prices, nothing else).
      # A read-only key means CI can never charge or refund anyone. The price
      # secrets are the LIVE ids (`_LIVE` suffix — the unsuffixed
      # STRIPE_PRICE_SOLO/GROWTH secrets above are test-mode and would never
      # resolve under a live key).
      - name: Live config drift check
        run: pnpm check:live
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_READONLY_KEY }}
          STRIPE_PRICE_SOLO: ${{ secrets.STRIPE_PRICE_SOLO_LIVE }}
          STRIPE_PRICE_GROWTH: ${{ secrets.STRIPE_PRICE_GROWTH_LIVE }}
