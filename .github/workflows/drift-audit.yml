# Deterministic spec ↔ code ↔ tests audit. On PRs it runs --strict: any
# finding fails the `audit` check (docs/README.md rule 6; the baseline is
# clean). Nightly it reports without --strict and opens or updates one issue
# labelled `drift`.
name: Drift audit

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Issue #331: the dependency audit lands in the check whose name already says what this is.
      # Runtime deps only, high and above; resolves from package-lock.json, no npm ci needed.
      - name: dependency audit (runtime deps, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: run audit
        id: audit
        run: |
          set +e
          node scripts/drift-audit.mjs ${{ github.event_name == 'pull_request' && '--strict' || '' }} > drift.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: fail on hard findings
        if: steps.audit.outputs.exit != '0'
        run: cat drift.md; exit 1
      - name: upsert the drift issue (nightly only)
        if: github.event_name != 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync("drift.md", "utf8");
            const hasFindings = /\| (GAP|UNSPECCED|MISSING|MALFORMED|TODO) /.test(report);
            const title = "Drift audit — nightly report";
            const { data: open } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", labels: "drift" });
            const existing = open.find(i => i.title === title);
            const body = `_Generated by \`scripts/drift-audit.mjs\` on ${new Date().toISOString().slice(0,10)}. Findings are gaps between SPEC.md, the code and the tests — each row is an issue to open or a marker to add, not a judgement._\n\n${report}`;
            if (hasFindings) {
              if (existing) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body, labels: ["drift"] });
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: "Audit clean tonight — closing." });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: "closed" });
            }
