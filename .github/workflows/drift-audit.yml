# Deterministic spec ↔ code ↔ tests audit, plus scripts/hygiene.mjs.
# On a pull request, drift-audit.mjs runs --strict and any hygiene finding
# fails the audit check. Nightly, drift-audit.mjs reports without --strict.
# Hygiene opens or comments on one [hygiene] issue when it is red.
name: Drift audit

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# A superseded push stops running (#1013).
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Issue #331: the dependency audit lands in the check whose name already says what this is.
      # Runtime deps only, high and above; resolves from package-lock.json, no npm ci needed.
      - name: dependency audit (runtime deps, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: run audit
        id: audit
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          node scripts/drift-audit.mjs ${{ github.event_name == 'pull_request' && '--strict --require-pr-body' || '' }} > drift.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: hygiene
        id: hygiene
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          extra=""
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -f /root/ops/reachkit/bin/resource-guard.sh ]; then
            extra="--box --file-issue"
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            extra="--file-issue"
          fi
          node scripts/hygiene.mjs --strict $extra > hygiene.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat hygiene.md >> "$GITHUB_STEP_SUMMARY"
      - name: fail on hard findings
        if: steps.audit.outputs.exit != '0' || steps.hygiene.outputs.exit != '0'
        run: |
          if [ "${{ steps.audit.outputs.exit }}" != "0" ]; then
            echo '## drift'
            cat drift.md
          fi
          if [ "${{ steps.hygiene.outputs.exit }}" != "0" ]; then
            echo '## hygiene'
            cat hygiene.md
          fi
          exit 1
