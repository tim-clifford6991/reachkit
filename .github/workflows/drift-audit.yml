# Deterministic spec ↔ code ↔ tests audit. On PRs it runs --strict: any
# finding fails the `audit` check. Nightly it reports without --strict
# (Actions summary only — it does not file issues).
name: Drift audit

on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# A superseded push stops running (#1013).
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # A light job: GitHub-hosted unless `CI_LIGHT_RUNNER` sends it to the
    # box's `reachkit-light` runner (owner, 2026-09-25, #1113; ci.yml says how).
    runs-on: ${{ fromJSON(vars.CI_LIGHT_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Issue #331: the dependency audit lands in the check whose name already says what this is.
      # Runtime deps only, high and above; resolves from package-lock.json, no npm ci needed.
      - name: dependency audit (runtime deps, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: run audit
        id: audit
        run: |
          set +e
          node scripts/drift-audit.mjs ${{ github.event_name == 'pull_request' && '--strict' || '' }} > drift.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: fail on hard findings
        if: steps.audit.outputs.exit != '0'
        run: cat drift.md; exit 1
