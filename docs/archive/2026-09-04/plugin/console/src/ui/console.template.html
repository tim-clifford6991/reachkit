<title>Factory Console</title>

<style>
  :root {
    --paper:#EDF0F4; --surface:#F7F9FB; --surface-2:#E3E8EF;
    --ink:#0A1826; --ink-2:#33465C; --muted:#5A6878; --faint:#8C99A8;
    --line:#D2DAE4; --line-strong:#B6C2D0;
    --accent:#1E63B0; --accent-2:#2C7BD1; --accent-wash:#DCE6F4;
    --ok:#2C7A57; --ok-wash:#D8EADF;
    --warn:#A9740F; --warn-wash:#F4E7CC;
    --bad:#B23A32; --bad-wash:#F4DCDA;
    --dead:#6B7A8C; --dead-wash:#E1E6EC;
    --blue-ground:#0E2E52; --blue-line:#7FB0E4;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"Cascadia Mono","Roboto Mono",monospace;
    --rail:78px; --nav:264px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0A1826; --surface:#0F2033; --surface-2:#16293E;
      --ink:#E6EDF5; --ink-2:#B9C7D6; --muted:#8B9BAD; --faint:#637488;
      --line:#1E344C; --line-strong:#2A4661;
      --accent:#58A0EA; --accent-2:#7CB8F2; --accent-wash:#16304E;
      --ok:#5FBE90; --ok-wash:#133124; --warn:#DCA43C; --warn-wash:#35290F;
      --bad:#E4736A; --bad-wash:#3A1C1A; --dead:#7A8CA0; --dead-wash:#1B2A3A;
      --blue-ground:#071C33; --blue-line:#6FA5DC;
    }
  }
  :root[data-theme="dark"] {
    --paper:#0A1826; --surface:#0F2033; --surface-2:#16293E;
    --ink:#E6EDF5; --ink-2:#B9C7D6; --muted:#8B9BAD; --faint:#637488;
    --line:#1E344C; --line-strong:#2A4661;
    --accent:#58A0EA; --accent-2:#7CB8F2; --accent-wash:#16304E;
    --ok:#5FBE90; --ok-wash:#133124; --warn:#DCA43C; --warn-wash:#35290F;
    --bad:#E4736A; --bad-wash:#3A1C1A; --dead:#7A8CA0; --dead-wash:#1B2A3A;
    --blue-ground:#071C33; --blue-line:#6FA5DC;
  }
  :root[data-theme="light"] {
    --paper:#EDF0F4; --surface:#F7F9FB; --surface-2:#E3E8EF;
    --ink:#0A1826; --ink-2:#33465C; --muted:#5A6878; --faint:#8C99A8;
    --line:#D2DAE4; --line-strong:#B6C2D0;
    --accent:#1E63B0; --accent-2:#2C7BD1; --accent-wash:#DCE6F4;
    --ok:#2C7A57; --ok-wash:#D8EADF; --warn:#A9740F; --warn-wash:#F4E7CC;
    --bad:#B23A32; --bad-wash:#F4DCDA; --dead:#6B7A8C; --dead-wash:#E1E6EC;
    --blue-ground:#0E2E52; --blue-line:#7FB0E4;
  }

  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4 { text-wrap:balance; margin:0; font-weight:600; letter-spacing:-0.012em; }
  .lab { font-family:var(--mono); font-size:10px; letter-spacing:0.13em; text-transform:uppercase; color:var(--muted); font-weight:500; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }
  :is(button,a,input,[tabindex]):focus-visible { outline:2px solid var(--accent-2); outline-offset:2px; border-radius:3px; }

  /* project switcher */
  .projbar { display:flex; align-items:stretch; gap:2px; padding:0 14px; background:var(--surface-2); border-bottom:1px solid var(--line); overflow-x:auto; }
  .projbar .who { display:flex; align-items:center; gap:8px; padding:0 12px 0 0; margin-right:6px; border-right:1px solid var(--line); flex:none; }
  .ptab { display:flex; align-items:center; gap:8px; padding:9px 13px 8px; border:0; border-bottom:2px solid transparent; background:none; cursor:pointer; color:var(--muted); font-size:12.5px; white-space:nowrap; text-decoration:none; flex:none; }
  .ptab:hover { color:var(--ink-2); background:var(--surface); }
  .ptab[aria-current="true"] { color:var(--ink); border-bottom-color:var(--accent); background:var(--surface); }
  .ptab .n { font-family:var(--mono); font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .ptab .warnmark { color:var(--bad); }
  .projbar .spacer { flex:1; min-width:8px; }
  .projbar .hint { display:flex; align-items:center; padding:0 4px; font-family:var(--mono); font-size:10px; color:var(--faint); white-space:nowrap; flex:none; }

  .banner { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; padding:9px 18px; background:var(--warn-wash); border-bottom:1px solid var(--line); color:var(--ink-2); font-size:12px; }
  .banner strong { color:var(--ink); font-weight:600; }

  /* 900px was a guess that clipped on any viewport shorter than a large
     laptop; dvh accounts for mobile chrome (URL bar, etc.) that vh does not.
     42px approximates the project bar's own height — the one chunk above
     the shell that is always present; the banner, when shown, adds a few
     more px the shell absorbs via its own internal scrollers rather than a
     second calc term. */
  .shell { display:grid; grid-template-columns:var(--rail) var(--nav) minmax(0,1fr); height:calc(100dvh - 42px); min-height:420px; border-bottom:1px solid var(--line); }

  /* rail */
  .rail { background:var(--surface-2); border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:1px; padding:12px 0; overflow-y:auto; }
  .brand { width:34px; height:34px; display:grid; place-items:center; background:var(--accent); color:#fff; border-radius:7px; font-family:var(--mono); font-size:13px; font-weight:600; margin-bottom:10px; flex:none; }
  .mod { width:62px; padding:7px 2px 6px; display:grid; place-items:center; gap:3px; border:0; background:none; border-radius:6px; cursor:pointer; color:var(--muted); font-family:var(--mono); font-size:8.5px; letter-spacing:0.05em; text-transform:uppercase; flex:none; }
  .mod svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.6; }
  .mod:hover { background:var(--paper); color:var(--ink-2); }
  .mod[aria-current="true"] { background:var(--accent); color:#fff; }
  .mod .count { font-size:8.5px; opacity:.75; }
  .rail hr { width:36px; border:0; border-top:1px solid var(--line-strong); margin:8px 0; flex:none; }

  /* navigator */
  .nav { background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .nav-head { padding:14px 15px 10px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; flex:none; }
  .nav-title { font-size:13px; font-weight:600; display:flex; align-items:baseline; gap:7px; }
  .nav-title .n { font-family:var(--mono); font-size:10.5px; color:var(--faint); }
  .search { width:100%; padding:6px 9px; background:var(--paper); border:1px solid var(--line); border-radius:5px; font-family:var(--mono); font-size:11px; color:var(--ink-2); }
  .search::placeholder { color:var(--faint); }
  .nav-list { overflow-y:auto; padding:6px 0 18px; flex:1; min-height:0; }
  .nav-group { padding:10px 15px 4px; display:flex; align-items:center; gap:7px; position:sticky; top:0; background:var(--surface); }
  .nav-group .lab { flex:1; }
  .nav-group .n { font-family:var(--mono); font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums; }
  .doc { width:100%; display:grid; grid-template-columns:8px minmax(0,1fr) auto; align-items:center; gap:9px; padding:6px 15px; border:0; background:none; text-align:left; cursor:pointer; color:var(--ink-2); font-size:12.5px; border-left:2px solid transparent; }
  .doc:hover { background:var(--surface-2); }
  .doc[aria-current="true"] { background:var(--accent-wash); border-left-color:var(--accent); color:var(--ink); }
  .doc .id { font-family:var(--mono); font-size:11px; color:var(--muted); }
  .doc[aria-current="true"] .id { color:var(--accent); }
  .doc .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--dead); }
  .dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.accent{background:var(--accent)}
  .badge-c { font-family:var(--mono); font-size:9.5px; padding:1px 5px; border-radius:9px; background:var(--surface-2); color:var(--muted); font-variant-numeric:tabular-nums; }

  /* canvas */
  .canvas { display:flex; flex-direction:column; min-width:0; background:var(--paper); overflow:hidden; }
  .topbar { display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--line); background:var(--surface); flex-wrap:wrap; flex:none; }
  .crumb { display:flex; align-items:baseline; gap:8px; flex:1; min-width:200px; flex-wrap:wrap; }
  /* Dogfood F5: with tabs ordered by registry position rather than the
     invoked root, this was the only place on the page that ever named which
     project you were looking at — and at 15px/600 it read as the quietest
     element in the bar, easy to miss entirely. Sized and weighted up so it
     reads as a heading, not a caption. */
  .crumb h1 { font-size:18px; font-weight:700; color:var(--ink); }
  .crumb .sep { color:var(--faint); }
  .stamp { font-family:var(--mono); font-size:10.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .btn { font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; padding:6px 11px; border-radius:5px; border:1px solid var(--line-strong); background:var(--paper); color:var(--ink-2); cursor:pointer; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }

  .subtabs { display:flex; gap:2px; padding:0 22px; border-bottom:1px solid var(--line); background:var(--surface); flex:none; }
  .subtab { border:0; background:none; padding:8px 12px 7px; cursor:pointer; font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); border-bottom:2px solid transparent; }
  .subtab:hover { color:var(--ink-2); }
  .subtab[aria-selected="true"] { color:var(--accent); border-bottom-color:var(--accent); }

  .scroll { overflow-y:auto; flex:1; min-height:0; }
  .pad { padding:22px; }

  /* tiles */
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:12px; margin-bottom:20px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:13px 14px 12px; display:flex; flex-direction:column; gap:8px; position:relative; overflow:hidden; cursor:pointer; text-align:left; }
  .tile::before { content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--stripe,var(--line-strong)); }
  .tile:hover { border-color:var(--accent); }
  .tile .v { font-family:var(--mono); font-size:25px; font-weight:500; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1; color:var(--ink); }
  .tile .v small { font-size:12px; color:var(--faint); font-weight:400; }
  .meter { display:flex; height:5px; border-radius:3px; overflow:hidden; background:var(--surface-2); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 10px; }
  .legend i { font-style:normal; font-family:var(--mono); font-size:9.5px; color:var(--muted); display:flex; align-items:center; gap:4px; font-variant-numeric:tabular-nums; }
  .legend i::before { content:""; width:6px; height:6px; border-radius:1.5px; background:var(--c); }

  .cols { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px; }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .panel-head { display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .panel-head .lab { flex:1; }
  .panel-body { padding:13px 14px; }

  .funnel { display:flex; flex-direction:column; gap:10px; }
  .stage { display:grid; grid-template-columns:92px minmax(0,1fr) 62px; align-items:center; gap:11px; }
  .stage .lab { text-align:right; }
  .bar { height:20px; background:var(--surface-2); border-radius:3px; overflow:hidden; display:flex; }
  .stage .n { font-family:var(--mono); font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; }

  /* gates row — four transition ratios, the pipeline's real health number */
  .gates { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:12px; }
  @media (max-width:860px) { .gates { grid-template-columns:repeat(2,1fr); } }
  .gate { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .gate .g { font-size:11.5px; color:var(--muted); }
  .gate .r { font-family:var(--mono); font-size:22px; font-weight:600; margin-top:5px; font-variant-numeric:tabular-nums; color:var(--ink); }
  .gate .r small { font-size:12px; color:var(--faint); font-weight:400; }
  .gate .why { font-size:11px; color:var(--muted); margin-top:3px; }

  /* coverage meters — rule 5.5, one row per edge-shaped field */
  .meter-row { padding:8px 0; border-top:1px solid var(--line); }
  .meter-row:first-child { border-top:0; padding-top:0; }
  .m-top { display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:5px; }
  .m-top .f { font-family:var(--mono); color:var(--ink-2); }
  .m-top .n { font-family:var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; }

  .risks { display:flex; flex-direction:column; }
  .risk { display:grid; grid-template-columns:3px minmax(0,1fr) auto; gap:11px; align-items:start; padding:10px 0; border-bottom:1px solid var(--line); }
  .risk:last-child { border-bottom:0; }
  .risk .stripe { align-self:stretch; border-radius:2px; background:var(--s); }
  .risk .h { font-size:12.5px; color:var(--ink); }
  .risk .m { font-size:11.5px; color:var(--muted); margin-top:2px; }
  code { font-family:var(--mono); font-size:11.5px; color:var(--ink-2); background:var(--surface-2); padding:0 4px; border-radius:3px; }

  .pill { font-family:var(--mono); font-size:9.5px; letter-spacing:0.07em; text-transform:uppercase; padding:2px 7px; border-radius:3px; white-space:nowrap; background:var(--pw,var(--surface-2)); color:var(--pc,var(--muted)); }
  .pill.ok{--pw:var(--ok-wash);--pc:var(--ok)} .pill.warn{--pw:var(--warn-wash);--pc:var(--warn)}
  .pill.bad{--pw:var(--bad-wash);--pc:var(--bad)} .pill.dead{--pw:var(--dead-wash);--pc:var(--dead)}
  .pill.acc{--pw:var(--accent-wash);--pc:var(--accent)}

  /* document reader */
  .dochead { padding:18px 26px 14px; border-bottom:1px solid var(--line); background:var(--surface); }
  .dochead .idline { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:7px; }
  .dochead .bigid { font-family:var(--mono); font-size:13px; color:var(--accent); font-weight:600; }
  .dochead h2 { font-size:20px; line-height:1.3; max-width:46em; }
  .dochead .path { font-family:var(--mono); font-size:10.5px; color:var(--faint); margin-top:8px; }
  .metagrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:9px; margin-top:14px; }
  .metacell { background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:7px 10px; min-width:0; }
  .metacell .k { font-family:var(--mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); }
  .metacell .v { font-size:12px; color:var(--ink-2); margin-top:2px; overflow-wrap:anywhere; }

  .prose { padding:22px 26px 40px; max-width:74ch; }
  .prose h1 { font-size:19px; margin:22px 0 10px; }
  .prose h2 { font-size:16px; margin:26px 0 9px; padding-bottom:5px; border-bottom:1px solid var(--line); }
  .prose h3 { font-size:14px; margin:20px 0 7px; }
  .prose h4 { font-size:13px; margin:16px 0 6px; color:var(--ink-2); }
  .prose p { margin:0 0 12px; color:var(--ink-2); }
  .prose ul, .prose ol { margin:0 0 12px; padding-left:22px; color:var(--ink-2); }
  .prose li { margin-bottom:5px; }
  .prose blockquote { margin:0 0 14px; padding:9px 14px; border-left:3px solid var(--accent); background:var(--surface); border-radius:0 5px 5px 0; color:var(--ink-2); }
  .prose blockquote p:last-child { margin-bottom:0; }
  .prose pre { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:11px 13px; overflow-x:auto; margin:0 0 14px; }
  .prose pre code { background:none; padding:0; font-size:11.5px; line-height:1.6; }
  .prose strong { color:var(--ink); font-weight:600; }
  .prose hr { border:0; border-top:1px solid var(--line); margin:20px 0; }
  .prose table { border-collapse:collapse; width:100%; margin:0 0 14px; font-size:12px; }
  .prose th, .prose td { border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top; }
  .prose th { background:var(--surface); font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); }
  .idref { font-family:var(--mono); font-size:11.5px; color:var(--accent); background:var(--accent-wash); padding:0 4px; border-radius:3px; cursor:pointer; border:0; }
  .idref:hover { background:var(--accent); color:#fff; }
  .prose a { color:var(--accent); }
  .prose .extref { font-family:var(--mono); font-size:11.5px; color:var(--ink-2); background:var(--surface-2); padding:0 4px; border-radius:3px; cursor:help; }

  /* tables */
  .tw { overflow:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface); max-height:640px; }
  table.grid { border-collapse:collapse; width:100%; min-width:760px; }
  .grid thead th { text-align:left; padding:9px 13px; border-bottom:1px solid var(--line); font-family:var(--mono); font-size:9.5px; letter-spacing:0.11em; text-transform:uppercase; color:var(--muted); font-weight:500; white-space:nowrap; background:var(--surface); position:sticky; top:0; z-index:1; }
  .grid tbody td { padding:9px 13px; border-bottom:1px solid var(--line); vertical-align:middle; font-size:12.5px; color:var(--ink-2); }
  .grid tbody tr { cursor:pointer; }
  .grid tbody tr:hover td { background:var(--surface-2); }
  .grid td.id { font-family:var(--mono); font-size:11.5px; color:var(--ink); white-space:nowrap; }
  .grid td.t { color:var(--ink); min-width:260px; }
  .grid td.dep { font-family:var(--mono); font-size:11px; color:var(--muted); white-space:nowrap; }

  /* graph */
  .cyano { background:var(--blue-ground); border:1px solid var(--line); border-radius:8px; overflow:hidden; position:relative; }
  .cyano-bar { display:flex; align-items:center; gap:7px; padding:10px 14px; border-bottom:1px solid #ffffff1f; flex-wrap:wrap; }
  .cyano-bar .lab { color:#A9CBEC; }
  .chip { font-family:var(--mono); font-size:10px; padding:3px 8px; border-radius:3px; border:1px solid #ffffff2e; color:#CDE1F5; background:#ffffff0f; cursor:pointer; display:flex; align-items:center; gap:5px; }
  .chip::before { content:""; width:7px; height:2px; border-radius:1px; background:var(--ec,#CDE1F5); }
  /* An off chip must not rely on opacity alone (WCAG 1.4.1) — dashed border
     and strikethrough carry the state for anyone who cannot perceive the
     dimming. */
  .chip[aria-pressed="false"] { opacity:.6; border-style:dashed; background:transparent; text-decoration:line-through; }
  .chip.plain::before { display:none; }
  .chip.plain[aria-pressed="true"] { background:var(--blue-line); border-color:var(--blue-line); color:#06203C; }
  #gcanvas { display:block; width:100%; height:560px; cursor:crosshair; }
  .tip { position:absolute; pointer-events:none; background:#04162BF5; border:1px solid var(--blue-line); border-radius:5px; padding:7px 9px; max-width:290px; color:#EAF3FC; font-size:11.5px; line-height:1.4; opacity:0; z-index:5; }
  .tip .tid { font-family:var(--mono); font-size:10.5px; color:var(--blue-line); display:block; }
  .gfoot { display:flex; gap:15px; flex-wrap:wrap; padding:9px 14px; border-top:1px solid #ffffff1f; }
  .gfoot span { font-family:var(--mono); font-size:10px; color:#A9CBEC; display:flex; align-items:center; gap:5px; }
  .gfoot span::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--c); }

  .erd-wrap { overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
  #erd { display:block; min-width:820px; width:100%; }

  .health { display:flex; flex-direction:column; gap:12px; }
  .hrow { display:grid; grid-template-columns:3px auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  .hrow .stripe { align-self:stretch; border-radius:2px; background:var(--s); }
  .hrow .n { font-family:var(--mono); font-size:21px; font-variant-numeric:tabular-nums; color:var(--ink); min-width:40px; }
  .hrow .h { font-size:13px; color:var(--ink); }
  .hrow .m { font-size:11.5px; color:var(--muted); margin-top:2px; }

  .modtable { font-size:12.5px; }
  .modtable td:first-child { font-family:var(--mono); font-size:11.5px; color:var(--accent); white-space:nowrap; }

  .note { margin-top:18px; padding:13px 15px; border:1px dashed var(--line-strong); border-radius:8px; color:var(--muted); font-size:12px; }
  .note strong { color:var(--ink-2); }

  .empty { padding:60px 26px; text-align:center; color:var(--muted); }
  .empty .lab { margin-bottom:8px; }

  /* visually-hidden but screen-reader-reachable — the canvas graph's only
     non-visual surface: the focused node's declared neighbours. */

    clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .navtoggle { display:none; }
  .navscrim { position:fixed; inset:0; background:#0009; z-index:25; }

  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  @media (max-width:980px) {
    .shell { grid-template-columns:var(--rail) minmax(0,1fr); height:calc(100dvh - 42px); }
    /* The navigator used to just vanish below this width, with nothing to
       bring it back. It is now a drawer: off-canvas by default, toggled by
       #nav-toggle in the topbar, dismissed by its own scrim or by picking an
       item. */
    .nav { display:none; }
    .nav.open { display:flex; position:fixed; top:0; bottom:0; left:var(--rail); width:min(320px,82vw);
      z-index:30; box-shadow:6px 0 24px #0009; }

  }
  /* ---- declared links in the document head (every type, every sub-tab) ---- */
  .linkstrip { margin-top:12px; display:flex; flex-direction:column; gap:5px; }
  .linkrow { display:flex; gap:9px; align-items:baseline; font-size:12px; }
  .linkrow .k { font-family:var(--mono); font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--faint); min-width:88px; flex:none; padding-top:2px; }
  .linkrow .v { display:flex; flex-wrap:wrap; gap:4px; align-items:center; min-width:0; }
  .linkmore { font-size:10.5px; color:var(--faint); }

  /* ---- the status control (only rendered when the server allows writes) ---- */
  .statuswrap { padding:0; display:inline-flex; }
  .statuswrap select { font-family:var(--mono); font-size:9.5px; letter-spacing:0.07em; text-transform:uppercase;
    color:inherit; background:transparent; border:0; padding:2px 6px; border-radius:3px; cursor:pointer; appearance:none; }
  .statuswrap select:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .statuswrap select:disabled { opacity:.5; cursor:progress; }
  .statuswrap select option { color:var(--ink); background:var(--surface); text-transform:none; letter-spacing:0; }
  .statuswrap::after { content:"⌄"; font-size:11px; line-height:1; align-self:center; padding-right:6px; margin-left:-3px; opacity:.7; }

  /* ---- the peek overlay ---- */
  .peek { width:min(860px,94vw); max-height:88vh; padding:0; border:1px solid var(--line); border-radius:10px;
    background:var(--surface); color:var(--ink); overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.34); }
  .peek::backdrop { background:rgba(8,10,14,.52); backdrop-filter:blur(2px); }
  .peek[open] { display:flex; flex-direction:column; }
  .peek-bar { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line); background:var(--surface-2); flex:none; }
  .peek-crumbs { display:flex; align-items:center; gap:5px; flex-wrap:wrap; min-width:0; flex:1; }
  .peek-crumbs .crumb { font-family:var(--mono); font-size:11px; color:var(--accent); background:none; border:0; padding:1px 4px; border-radius:3px; cursor:pointer; }
  .peek-crumbs .crumb:hover { background:var(--accent-wash); }
  .peek-crumbs .crumb.cur { color:var(--ink); cursor:default; }
  .peek-crumbs .sep { color:var(--faint); font-size:11px; }
  .peek-body { overflow:auto; flex:1; min-height:0; }
  .peek-body .dochead { border-bottom:1px solid var(--line); }
  @media (max-width:560px) { .peek { width:100vw; max-width:100vw; max-height:100vh; border-radius:0; } }

  /* ---- write feedback ---- */
  .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60; max-width:min(560px,92vw);
    font-family:var(--mono); font-size:11.5px; padding:9px 14px; border-radius:6px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); box-shadow:0 10px 30px rgba(0,0,0,.28); }
  .toast.bad { border-color:var(--bad); color:var(--bad); }

  /* ---- the navigator's folding "On this page" group ---- */
  .nav-fold { width:100%; text-align:left; background:none; border:0; cursor:pointer; font:inherit; color:inherit; }
  .nav-fold .caret { display:inline-block; width:9px; color:var(--faint); }
  .nav-fold:hover .lab { color:var(--ink); }
  .nav-fold-body { border-bottom:1px solid var(--line); padding-bottom:5px; margin-bottom:3px; }

  @media (max-width:560px) { .shell { grid-template-columns:minmax(0,1fr); } .nav.open { left:0; } .rail { flex-direction:row; overflow-x:auto; justify-content:flex-start; padding:8px 10px; border-right:0; border-bottom:1px solid var(--line); } .brand { margin-bottom:0; } .rail hr { display:none; } .prose, .dochead { padding-left:16px; padding-right:16px; } }

<script src="/mermaid.min.js"></script>
<script>
const G = /*__GRAPH__*/;
const APP = /*__APP__*/;
/* isDarkNow() is a function declaration (hoisted), so it is callable here
   even though it is defined further down near the rest of the theme code. */
if (window.mermaid) mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDarkNow() ? "dark" : "default" });

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
const fmt = (n) => n.toLocaleString("en-US");

const NODE = new Map(G.nodes.map((n) => [n.i, n]));
const OUT = new Map(), IN = new Map(), DEG = new Map();
for (const [f, t, r] of G.edges) {
  (OUT.get(f) || OUT.set(f, []).get(f)).push([t, r]);
  (IN.get(t) || IN.set(t, []).get(t)).push([f, r]);
  DEG.set(f, (DEG.get(f) || 0) + 1); DEG.set(t, (DEG.get(t) || 0) + 1);
}

/* The rail is built from the project's declared types, not from a fixed
   list — a project may rename, drop or add one. Icons are keyed by the
   conventional prefixes; anything else gets a generic mark. */
const ICONS = {
  REQ: '<path d="M5 3h9l5 5v13H5z"/><path d="M14 3v5h5"/><path d="M8 12h7M8 16h7"/>',
  BP:  '<path d="M3 5h18v14H3z"/><path d="M3 10h18M9 10v9"/>',
  WO:  '<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/>',
  ADR: '<path d="M21 12a9 9 0 1 1-3.2-6.9"/><path d="M9 12l2.5 2.5L21 5"/>',
  CON: '<path d="M12 3l9 16H3z"/><path d="M12 9v5M12 17h.01"/>',
  ASM: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3 2.4V13"/><path d="M12 16h.01"/>',
  FB:  '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  JN:  '<path d="M8 4c-1.7 0-2.5 1.3-2.5 2.8S6.3 9.6 8 9.6s2.5-1.3 2.5-2.8S9.7 4 8 4z"/><path d="M16 10.4c-1.7 0-2.5 1.3-2.5 2.8s.8 2.8 2.5 2.8 2.5-1.3 2.5-2.8-.8-2.8-2.5-2.8z"/><path d="M8 12.5v3M16 18.7v2.3"/>',
  _:   '<path d="M4 5h16v14H4z"/><path d="M8 10h8M8 14h5"/>',
};
const RAIL_LABEL = { REQ:"Reqs", BP:"Blue", WO:"Work", ADR:"Dec", CON:"Confl", ASM:"Assum", FB:"Fdbk", JN:"Journ" };
/* `key` is how a front-matter node's own `.y` actually reads ("requirement",
 * not "REQ") and how G.counts/G.status are actually keyed under that
 * grammar (extract/index.mjs) — every lookup against either must go through
 * TYPES[id].key, never the id itself, or it silently misses under
 * front-matter (G.counts["REQ"] is undefined; G.counts["requirement"] is
 * the real count). `null` means this declared type has no front-matter
 * representation at all (CON/ASM, retired under rule 2.3) — a real zero,
 * kept distinct from a typo. */
const TYPES = Object.fromEntries(G.types.map((t) => [t.id, {
  label: RAIL_LABEL[t.id] || t.id,
  name: t.label,
  shape: t.shape,
  icon: ICONS[t.id] || ICONS._,
  key: t.key === undefined ? t.id : t.key,
}]));
/* A node's `y` is its type's KEY ("journey"), while TYPES — and therefore
 * go()'s first argument, the rail, and the URL hash — are keyed by its ID
 * ("JN"). Every place that starts from a node and needs a section has to
 * cross that gap; `go(n.y, id)` silently did not, so following ANY link
 * threw on `(TYPES[sec] || VIEWS[sec]).name` and the click did nothing at
 * all. One map, derived from the same G.types the rest of this file reads,
 * rather than a second convention to keep in sync. */
const SECTION_OF = Object.fromEntries(G.types.map((t) => [t.key === undefined ? t.id : t.key, t.id]));
const sectionFor = (n) => SECTION_OF[n.y] || n.y;

const ID_PREFIXES = G.types.map((t) => t.id).concat(G.externalIdPrefixes || []);
const ID_IN_PROSE = new RegExp(`\\b(${ID_PREFIXES.join("|")})-(\\d{3})([a-z])?\\b`, "g");
const VIEWS = {
  overview: { label:"Home",  name:"Overview",   icon:'<path d="M4 11l8-7 8 7"/><path d="M6 10v10h12V10"/>' },
  strategy: { label:"Strat", name:"Strategy",   icon:'<path d="M3 20h18"/><path d="M6 20V9M12 20V4M18 20v-7"/>' },
  system:   { label:"Sys",   name:"System",     icon:'<circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M7 18c5-2 3-9 10-12"/>' },
  cycle:    { label:"Cycle", name:"Cycle",      icon:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>' },
  graph:    { label:"Graph", name:"Knowledge graph", icon:'<path d="M12 3v6M12 15v6M3 12h6M15 12h6"/><circle cx="12" cy="12" r="3"/>' },
  erd:      { label:"Data",  name:"Data model", icon:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>' },
  health:   { label:"Health",name:"Health",     icon:'<path d="M12 3l9 5v8l-9 5-9-5V8z"/><path d="M12 12l9-4M12 12v9M12 12L3 8"/>' },
};

/* Ten status words added alongside front-matter's per-type vocabularies
   (constitution rule 2.2b): validation's pass/pass-with-findings/fail/unknown
   (readVerdict()'s own four words, verbatim), feedback's routed/merged-into/
   closed, and decision's proposed — open and accepted were already mapped.
   `fail` gets the danger hue (`bad`); `superseded` stays on the neutral
   `dead` hue — the one place this palette needed the two to read as visually
   different rather than as two shades of "not current". */
const STATUS_PILL = {
  done:"ok", approved:"acc", accepted:"acc", resolved:"ok", draft:"warn", "in-review":"acc", open:"bad",
  superseded:"dead", struck:"dead", removed:"dead", retired:"dead", confirmed:"ok", refuted:"bad",
  unconfirmed:"warn", reserved:"dead",
  pass:"ok", "pass-with-findings":"warn", fail:"bad", unknown:"dead",
  routed:"acc", "merged-into":"dead", closed:"ok", proposed:"warn",
};
const STATUS_DOT = {
  done:"ok", resolved:"ok", confirmed:"ok", approved:"accent", accepted:"accent", "in-review":"accent",
  draft:"warn", unconfirmed:"warn", open:"bad", refuted:"bad",
  pass:"ok", "pass-with-findings":"warn", fail:"bad", unknown:"",
  routed:"accent", "merged-into":"", closed:"ok", proposed:"warn",
};
const SEGV = {
  done:"--ok", resolved:"--ok", confirmed:"--ok", approved:"--accent", accepted:"--accent", "in-review":"--blue-line",
  draft:"--warn", unconfirmed:"--warn", open:"--bad", refuted:"--bad", superseded:"--dead",
  pass:"--ok", "pass-with-findings":"--warn", fail:"--bad", unknown:"--dead",
  routed:"--accent", "merged-into":"--dead", closed:"--ok", proposed:"--warn",
};

/* ================= state ================= */
let section = "overview", selected = null, subtab = "document", navQuery = "";
/* The "On this page" group's fold state. Persisted because it is a standing
   preference about how the reader wants the navigator laid out, not a
   per-document choice — re-collapsing it on every navigation would make the
   fold useless. A private-mode browser that throws on localStorage just gets
   the default. */
let outlineOpen = (() => { try { return localStorage.getItem("fc-outline") !== "0"; } catch { return true; } })();

/* ================= markdown ================= */
function inline(s) {
  let h = esc(s);
  h = h.replace(/`([^`]+)`/g, (m, c) => `<code>${c}</code>`);
  h = h.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  // A link target survives now instead of being discarded: http(s) becomes a
  // real, safe-to-click <a> (new tab, no window.opener handback); anything
  // else — a relative path, a mailto:, a bare anchor — becomes a monospace
  // span, because this console has no router for it to resolve against, but
  // the target is still worth showing, so it goes in the title attribute
  // rather than vanishing. `h` was already run through esc() above, so
  // `target` here is already entity-safe — re-escaping it would double-encode
  // any `&` in a query string.
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, text, target) => {
    const t = target.trim();
    return /^https?:\/\//i.test(t)
      ? `<a href="${t}" rel="noopener" target="_blank">${text}</a>`
      : `<span class="extref" title="${t}">${text}</span>`;
  });
  h = h.replace(ID_IN_PROSE,
    (m) => NODE.has(m) ? `<button class="idref" data-goto="${esc(m)}">${m}</button>` : `<span class="idref" style="opacity:.55">${m}</span>`);
  return h;
}
/** A heading's text, folded into an id anchor safe to drop in the DOM and in
 * a URL hash segment. Never empty — an all-punctuation heading still needs
 * a jumpable target. */
function slugify(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "section";
}
/**
 * `seen` de-duplicates ids within one document (two "Notes" headings must not
 * collide); it is threaded through the blockquote recursion below so nested
 * headings share the same counter rather than restarting one, which would
 * silently produce two elements with the same id.
 *
 * `outlineOut`, when given, receives one {level, text, id} entry per heading
 * as a side effect — the TOC (work item 4) reads this from renderDoc() to
 * build the navigator's jump list without a second, divergent parse of the
 * same source that could disagree with the ids actually rendered here.
 */
function md(src, seen, outlineOut) {
  seen = seen || new Map();
  const lines = String(src).split("\n");
  const out = []; let i = 0;
  const flushP = (buf) => { if (buf.length) out.push(`<p>${inline(buf.join(" "))}</p>`); buf.length = 0; };
  let para = [];
  while (i < lines.length) {
    const L = lines[i];
    const fence = L.match(/^```\s*([\w-]*)/);
    if (fence) {
      flushP(para); const code = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) code.push(lines[i++]);
      i++;
      out.push(fence[1] === "mermaid"
        ? `<pre class="mermaid">${esc(code.join("\n"))}</pre>`
        : `<pre><code>${esc(code.join("\n"))}</code></pre>`);
      continue;
    }
    if (/^\s*\|.*\|\s*$/.test(L)) {
      flushP(para); const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = rows.map((r) => r.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim()));
      const body = cells.filter((c) => !c.every((x) => /^:?-{2,}:?$/.test(x)));
      if (body.length) {
        out.push(`<table><thead><tr>${body[0].map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
          body.slice(1).map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + `</tbody></table>`);
      }
      continue;
    }
    const h = L.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushP(para);
      const lv = Math.min(h[1].length, 4), text = h[2].trim();
      let id = slugify(text);
      const n = (seen.get(id) || 0) + 1; seen.set(id, n);
      if (n > 1) id = `${id}-${n}`;
      if (outlineOut) outlineOut.push({ level: lv, text, id });
      out.push(`<h${lv} id="${esc(id)}">${inline(h[2])}</h${lv}>`);
      i++; continue;
    }
    if (/^\s*>/.test(L)) {
      flushP(para); const q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${md(q.join("\n"), seen, outlineOut)}</blockquote>`); continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(L)) {
      flushP(para); const ord = /^\s*\d+\./.test(L); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        let it = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])) it += " " + lines[i++].trim();
        items.push(`<li>${inline(it)}</li>`);
      }
      out.push(`<${ord ? "ol" : "ul"}>${items.join("")}</${ord ? "ol" : "ul"}>`); continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(L)) { flushP(para); out.push("<hr />"); i++; continue; }
    if (!L.trim()) { flushP(para); i++; continue; }
    para.push(L.trim()); i++;
  }
  flushP(para);
  return out.join("\n");
}

/* ================= rail ================= */
(function rail() {
  const r = $("#rail");
  const add = (k, d, count) => {
    const b = document.createElement("button");
    b.className = "mod"; b.type = "button"; b.dataset.sec = k;
    b.innerHTML = `<svg viewBox="0 0 24 24">${d.icon}</svg>${d.label}` + (count !== undefined ? `<span class="count mono">${count}</span>` : "");
    r.appendChild(b);
  };
  add("overview", VIEWS.overview); add("strategy", VIEWS.strategy); add("system", VIEWS.system); add("cycle", VIEWS.cycle);
  r.appendChild(document.createElement("hr"));
  for (const [k, d] of Object.entries(TYPES)) add(k, d, d.key ? G.counts[d.key] : 0);
  r.appendChild(document.createElement("hr"));
  add("graph", VIEWS.graph); add("erd", VIEWS.erd); add("health", VIEWS.health);
  r.addEventListener("click", (e) => { const b = e.target.closest(".mod"); if (b) go(b.dataset.sec, null); });
})();

$("#stamp").textContent = `${G.counts.total} artifacts · ${fmt(G.counts.declaredEdges)} edges · ${fmt(G.counts.mentionPairs)} mentions` +
  (G.code?.present ? ` · ${fmt(G.code.counts.commits)} commits` : "");

/* ================= projects ================= */
/* One tab per registered project. Each parses independently — nothing is
   shared between them but the doctrine version — so switching is a real
   navigation, not a client-side filter. */
(function projects() {
  const bar = $("#projbar");
  const initials = (s) => (s.match(/[A-Za-z0-9]+/g) || ["?"]).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  $("#brand").textContent = initials(APP.project.name);
  $("#proj-name").textContent = APP.project.name;
  document.title = `${APP.project.name} — Factory Console`;

  bar.innerHTML =
    `<span class="who"><span class="lab">Factory</span><span class="mono" style="font-size:10px;color:var(--faint)">${esc(APP.doctrineVersion)}</span></span>` +
    APP.projects.map((p, i) => {
      const cur = i === APP.index;
      const errs = p.errors || 0;
      return `<a class="ptab" role="tab" href="?p=${i}" aria-current="${cur}">
        <span>${esc(p.name)}</span>
        <span class="n">${p.total ?? "—"}</span>
        ${errs ? `<span class="warnmark" title="${errs} conformance errors">●</span>` : ""}
        ${p.registered ? "" : '<span class="n" title="not in ~/.factory/projects.json">unsaved</span>'}
      </a>`;
    }).join("") +
    `<span class="spacer"></span>` +
    `<button class="ptab" id="theme-toggle" type="button" aria-label="Toggle color theme"></button>` +
    `<span class="hint">${esc(APP.project.path)}</span>`;

  if (APP.notice) {
    const b = $("#banner");
    b.hidden = false;
    b.innerHTML = `<strong>${esc(APP.notice.title)}</strong><span>${esc(APP.notice.body)}</span>`;
  }
})();

/* ================= theme ================= */
/* Three states cycling on one control: system (no override — the
   MutationObserver below and the media-query CSS both already handle this
   case, it is simply the absence of data-theme), light, dark. The
   MutationObserver that repaints the canvas on a data-theme change already
   existed before this wave; what was missing was anything that ever set the
   attribute. */
const THEME_LABEL = { system: "◐ auto", light: "☀ light", dark: "☾ dark" };
const THEME_ORDER = ["system", "light", "dark"];
function currentTheme() { return document.documentElement.getAttribute("data-theme") || "system"; }
/* The resolved theme, not the three-state control's setting: an explicit
   data-theme wins, otherwise fall back to the media query. Mermaid has no
   concept of "system" — it needs one concrete theme to initialize with. */
function isDarkNow() {
  const dt = document.documentElement.getAttribute("data-theme");
  if (dt === "dark") return true;
  if (dt === "light") return false;
  return typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  const b = $("#theme-toggle");
  if (b) { b.textContent = THEME_LABEL[t]; b.setAttribute("aria-pressed", String(t !== "system")); }
  try { localStorage.setItem("factory-console-theme", t); } catch { /* no storage available; state just won't persist */ }
  // Mermaid bakes its theme into the rendered SVG at run() time, so a plain
  // repaint can't follow a theme change — the diagrams have to be re-run.
  // Re-rendering means starting from the cached markdown again (md()), since
  // mermaid.run() has already replaced the <pre class="mermaid"> with an SVG.
  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: isDarkNow() ? "dark" : "default" });
    if (selected && TYPES[section] && subtab === "document") renderCanvas();
  }
}
(function initTheme() {
  let saved = "system";
  try { saved = localStorage.getItem("factory-console-theme") || "system"; } catch { /* fine, default to system */ }
  applyTheme(THEME_ORDER.includes(saved) ? saved : "system");
  $("#theme-toggle")?.addEventListener("click", () => {
    const next = THEME_ORDER[(THEME_ORDER.indexOf(currentTheme()) + 1) % THEME_ORDER.length];
    applyTheme(next);
  });
})();

/* ================= navigator drawer (narrow viewports) ================= */
function closeNavDrawer() {
  $("#nav")?.classList.remove("open");
  const scrim = $("#navscrim"); if (scrim) scrim.hidden = true;
  $("#nav-toggle")?.setAttribute("aria-expanded", "false");
}
$("#nav-toggle")?.addEventListener("click", () => {
  const nav = $("#nav"); if (!nav) return;
  const open = !nav.classList.contains("open");
  nav.classList.toggle("open", open);
  const scrim = $("#navscrim"); if (scrim) scrim.hidden = !open;
  $("#nav-toggle").setAttribute("aria-expanded", String(open));
});
$("#navscrim")?.addEventListener("click", closeNavDrawer);

/* ================= deep links ================= */
/* #<section>[/<id>] — the Back button and a pasted link both land on the
   same document the URL names. A jump-list anchor (the TOC) rides along as
   a third segment but is applied opportunistically once the document body
   has actually loaded, since it fetches on demand (5a.1) and the target
   heading does not exist in the DOM until it does. */
function parseHash() {
  const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (!raw) return null;
  const [sec, id, jump] = raw.split("/");
  return { sec: sec || "overview", id: id || null, jump: jump || null };
}
function applyHashJump() {
  const h = parseHash();
  if (!h || !h.jump) return;
  const el = document.getElementById(h.jump);
  if (el) el.scrollIntoView({ block: "start" });
}

/* ================= navigation ================= */
function go(sec, id, opts) {
  opts = opts || {};
  // Any peek belongs to the document being left. Navigating out from under
  // one (the rail, the navigator, the Back button, a pasted link) has to take
  // it with you, or the overlay outlives the trail its crumbs describe.
  peekCloseAll();
  section = sec; selected = id; if (!id) subtab = "document";
  navQuery = ""; $("#nav-search").value = "";
  document.querySelectorAll(".mod").forEach((m) => m.setAttribute("aria-current", String(m.dataset.sec === sec)));
  // A section that is neither a type nor a view is a caller bug, not a
  // reason to leave the page half-rendered mid-navigation — the id still
  // resolves and the document still opens.
  $("#crumb-sec").textContent = (TYPES[sec] || VIEWS[sec] || { name: sec }).name;
  const doc = id ? NODE.get(id) : null;
  $("#crumb-sep").hidden = !doc; $("#crumb-doc").hidden = !doc;
  if (doc) $("#crumb-doc").textContent = id;
  $("#btn-back").hidden = !doc;
  // A hashchange-driven call (the Back button, a pasted deep link) must not
  // re-push the hash it was itself reacting to — that would double every
  // Back press into a no-op forward/back pair.
  if (!opts.fromHash) {
    const h = "#" + [sec, id].filter(Boolean).map(encodeURIComponent).join("/");
    if (location.hash !== h) location.hash = h;
  }
  renderNav(); renderCanvas();
  closeNavDrawer();
  // a11y: land focus on the region that just changed, rather than wherever
  // it happened to be (typically the nav item or rail button just clicked,
  // which is fine, but a screen-reader user following a link or the Back
  // button otherwise hears nothing about the new view).
  requestAnimationFrame(() => { const m = document.querySelector("main.canvas"); if (m && m.focus) m.focus(); });
}
window.addEventListener("hashchange", () => {
  const h = parseHash();
  if (!h) return;
  const known = TYPES[h.sec] || VIEWS[h.sec];
  go(known ? h.sec : "overview", known ? h.id : null, { fromHash: true });
});
$("#btn-back").addEventListener("click", () => go(section, null));
$("#nav-search").addEventListener("input", (e) => { navQuery = e.target.value.toLowerCase(); renderNav(); });

function sectionItems() {
  const T = TYPES[section];
  if (!T || !T.key) return []; // no key at all (retired under this grammar) → correctly empty
  return G.nodes.filter((n) => n.y === T.key)
    .filter((n) => !navQuery || n.i.toLowerCase().includes(navQuery) || (n.t || "").toLowerCase().includes(navQuery))
    .sort((a, b) => b.i.localeCompare(a.i));
}

function renderNav() {
  const T = TYPES[section], V = VIEWS[section];
  $("#nav-title").textContent = (T || V || { name: section }).name;
  const list = $("#nav-list");

  if (T) {
    // The artifact list is the navigator's permanent body — opening a
    // document no longer replaces it. Before this, the list was swapped
    // wholesale for the open document's heading outline, which meant the one
    // thing a reader most wants next (the SIBLING artifact) cost a trip back
    // through the rail. The outline keeps its place, as a collapsible group
    // pinned above the list, so both are one click away at all times.
    const items = sectionItems();
    const typeTotal = (T.key && G.counts[T.key]) || 0;
    $("#nav-n").textContent = `${items.length}/${typeTotal}`;
    $("#nav-search").placeholder = `Filter ${typeTotal} ${T.name.toLowerCase()}…`;

    let outlineHtml = "";
    if (selected && subtab === "document") {
      // DOC_OUTLINE is populated by renderDoc()'s md() pass, which is async
      // (the body is fetched on demand, 5a.1) — renderDoc() calls renderNav()
      // again the moment it lands, so "Loading…" is the pre-fetch state, not
      // an error one.
      const secOutline = DOC_OUTLINE.get(selected);
      const rows = !secOutline
        ? `<div class="doc" style="cursor:default"><span class="dot"></span><span class="t" style="color:var(--faint)">Loading…</span><span></span></div>`
        : !secOutline.length
          ? `<div class="doc" style="cursor:default"><span class="dot"></span><span class="t" style="color:var(--faint)">No headings in this document.</span><span></span></div>`
          : secOutline.map((o) => `<button class="doc" type="button" data-jump="${esc(o.id)}" style="padding-left:${15 + (o.level - 1) * 12}px">
              <span class="dot accent" style="opacity:${o.level <= 1 ? 1 : .55}"></span>
              <span class="t">${esc(o.text.slice(0, 70))}</span><span></span></button>`).join("");
      outlineHtml = `<button class="nav-group nav-fold" type="button" data-fold="outline" aria-expanded="${outlineOpen}">
          <span class="lab"><span class="caret">${outlineOpen ? "▾" : "▸"}</span> On this page · ${esc(selected)}</span>
          <span class="n">${secOutline ? secOutline.length : ""}</span></button>` +
        (outlineOpen ? `<div class="nav-fold-body">${rows}</div>` : "");
    }

    const groups = {};
    for (const n of items) (groups[n.s || "unset"] ||= []).push(n);
    const order = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
    list.innerHTML = outlineHtml + order.map((k) => `<div class="nav-group"><span class="lab">${esc(k)}</span><span class="n">${groups[k].length}</span></div>` +
      groups[k].map((n) => `<button class="doc" type="button" data-id="${esc(n.i)}" ${selected === n.i ? 'aria-current="true"' : ""}>
        <span class="dot ${STATUS_DOT[n.s] || ""}"></span>
        <span class="t"><span class="id">${n.i}</span> · ${esc((n.t || "").slice(0, 44))}</span>
        <span>${DEG.get(n.i) ? `<span class="badge-c">${DEG.get(n.i)}</span>` : ""}</span></button>`).join("")).join("");

    // A filter typed against 60 journeys can push the open one out of view;
    // so can simply opening a document near the bottom of its list. "nearest"
    // rather than "start" so an item already visible does not jolt the pane.
    if (selected) requestAnimationFrame(() => list.querySelector('.doc[aria-current="true"]')?.scrollIntoView({ block: "nearest" }));
    return;
  }

  $("#nav-n").textContent = "";
  $("#nav-search").placeholder = "Filter…";
  const outline = {
    overview: FM_GRAMMAR
      ? [["Counts by stage", "tiles"], ["Transition gates", "gates"], ["Blocking the pipeline", "blockers"], ["Graph coverage · rule 5.5", "coverage"]]
      : [["Counts by stage", "tiles"], ["Pipeline throughput", "funnel"], ["Blocking the pipeline", "blockers"]],
    strategy: [["Project charter", "charter"], [`Module map · ${G.modules.length}`, "modules"], ["Blueprint hierarchy", "tree"]],
    graph: [["Corpus view", "corpus"], ["Relation filters", "rels"], ["Most connected", "hubs"]],
    erd: [["Entity diagram", "diagram"], ...G.tables.map((t) => [`${t.n} · ${t.c.length} cols`, "diagram"])],
    health: [["All findings", "all"]],
  }[section] || [];
  list.innerHTML = `<div class="nav-group"><span class="lab">Contents</span></div>` +
    outline.map(([label, anchor]) => `<button class="doc" type="button" data-anchor="${anchor}">
      <span class="dot accent"></span><span class="t">${esc(label)}</span><span></span></button>`).join("");
}

$("#nav-list").addEventListener("click", (e) => {
  const f = e.target.closest("[data-fold]");
  if (f) {
    outlineOpen = !outlineOpen;
    try { localStorage.setItem("fc-outline", outlineOpen ? "1" : "0"); } catch { /* private mode; fold is session-only */ }
    renderNav();
    return;
  }
  const b = e.target.closest(".doc"); if (!b) return;
  if (b.dataset.id) { selected = b.dataset.id; subtab = "document"; go(section, b.dataset.id); }
  else if (b.dataset.jump) {
    const el = document.getElementById(b.dataset.jump);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    const h = "#" + [section, selected, b.dataset.jump].filter(Boolean).map(encodeURIComponent).join("/");
    if (location.hash !== h) location.hash = h;
    closeNavDrawer();
  } else if (b.dataset.anchor) {
    const el = document.getElementById("a-" + b.dataset.anchor);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    closeNavDrawer();
  }
});

/* Where a link leads depends on where it was clicked.
 *
 * Inside an open document (or inside a peek already), following a link is
 * almost always a detour — read the requirement, decide whether it is right,
 * come back to the journey you were reading. That is a peek. Outside one (a
 * list table, an overview panel), a click IS the navigation the reader
 * wanted, so it stays one.
 *
 * A modified click always navigates, matching what a modifier means
 * everywhere else, and gives a keyboard route out of the peek entirely. */
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-goto]"); if (!g) return;
  const id = g.dataset.goto, n = NODE.get(id); if (!n) return;
  const inDocument = PEEK.length > 0 || (selected && TYPES[section]);
  const forceFull = g.dataset.full === "1" || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey;
  if (inDocument && !forceFull) {
    e.preventDefault();
    return peekPush(id);
  }
  peekCloseAll();
  go(sectionFor(n), id);
});

/* ================= peek ================= */
/* A stack, not a single overlay: following REQ-004 from JN-001 and then
   BP-012 from REQ-004 is one reading thread, and popping it has to give back
   the previous step rather than dump the reader at the top. The underlying
   canvas is never re-rendered while a peek is open, so the journey behind it
   keeps its scroll position exactly. */
const PEEK = [];
let peekGen = 0;

function peekPush(id) {
  if (!NODE.has(id)) return;
  if (PEEK[PEEK.length - 1] === id) return; // already showing it
  PEEK.push(id);
  const dlg = $("#peek");
  if (dlg && !dlg.open) dlg.showModal();
  renderPeek();
}
/** Pop back to `depth` levels (0 closes). */
function peekPopTo(depth) {
  PEEK.length = Math.max(0, depth);
  if (!PEEK.length) return peekCloseAll();
  renderPeek();
}
function peekCloseAll() {
  PEEK.length = 0;
  const dlg = $("#peek");
  if (dlg && dlg.open) dlg.close();
}

function renderPeek() {
  const dlg = $("#peek"); if (!dlg) return;
  const id = PEEK[PEEK.length - 1];
  const n = NODE.get(id);
  const gen = ++peekGen;

  // The trail always begins at whatever the canvas is actually showing, so
  // the first crumb is a real way back to it and not a decoration.
  const trail = [];
  if (selected && NODE.has(selected)) trail.push({ id: selected, depth: 0 });
  PEEK.forEach((pid, i) => trail.push({ id: pid, depth: i + 1 }));
  $("#peek-crumbs").innerHTML = trail.map((c, i) => {
    const last = i === trail.length - 1;
    return `${i ? '<span class="sep">›</span>' : ""}` + (last
      ? `<span class="crumb cur" aria-current="true">${esc(c.id)}</span>`
      : `<button class="crumb" type="button" data-depth="${c.depth}">${esc(c.id)}</button>`);
  }).join("");
  $("#peek-open").dataset.goto = id;
  $("#peek-open").dataset.full = "1";

  const body = $("#peek-body");
  body.scrollTop = 0;
  body.innerHTML = `<div class="pad"><div class="lab">Loading…</div></div>`;
  renderPeekBody(n).then((html) => {
    if (gen !== peekGen) return;
    body.innerHTML = html;
    renderMermaid(body);
  }).catch((e) => {
    if (gen !== peekGen) return;
    body.innerHTML = `<div class="pad"><div class="note"><strong>Could not open ${esc(id)}.</strong> ${esc(e.message)}</div></div>`;
  });
}

/* Deliberately NOT renderDoc(): that function reads the global `subtab`, and
   a peek has no sub-tabs — it is always the document, which is the thing a
   reader detoured to read. The head and the journey flow are the same
   builders the canvas uses, so a peeked artifact never disagrees with the
   full view of itself. `md()` gets a throwaway outline sink: the navigator's
   "On this page" must keep describing the document behind the peek. */
async function renderPeekBody(n) {
  if (!n) return `<div class="empty"><div class="lab">Not found</div></div>`;
  const head = renderDocHead(n);
  const flow = n.y === "journey" ? `<div class="pad">${journeyFlow(n.i)}</div>` : "";
  try {
    const raw = await fetchDoc(n.i);
    return head + flow + `<div class="prose">${md(stripFrontMatter(raw), undefined, [])}</div>`;
  } catch (e) {
    return head + flow + `<div class="pad"><div class="note"><strong>Could not load this document's body.</strong> ${esc(e.message)}</div></div>`;
  }
}

$("#peek-crumbs")?.addEventListener("click", (e) => {
  const b = e.target.closest("[data-depth]"); if (!b) return;
  peekPopTo(Number(b.dataset.depth));
});
$("#peek-close")?.addEventListener("click", () => peekCloseAll());
/* Esc pops ONE level rather than closing the stack — the point of the stack
   is that stepping back is cheap. <dialog>'s own Esc handling would close
   outright, so it is cancelled and re-implemented. */
$("#peek")?.addEventListener("cancel", (e) => { e.preventDefault(); peekPopTo(PEEK.length - 1); });
/* A click on the backdrop lands on the <dialog> element itself, never on its
   children — that is the whole test, and it needs no hit-box arithmetic. */
$("#peek")?.addEventListener("click", (e) => { if (e.target === $("#peek")) peekPopTo(PEEK.length - 1); });

/* ================= status write ================= */
/* The console's only mutation, and only when it was started with --write —
 * the control does not exist otherwise (statusControl() renders a pill), and
 * the server would answer 405 even if it did.
 *
 * `from` is sent with every write: the corpus is written by agents while a
 * browser tab is open, so the server refuses (409) if the file's status is no
 * longer what this page believed. The select then snaps back to the value it
 * had, because the page's belief — not the reader's click — is what turned
 * out to be stale. */
function toast(msg, bad) {
  const t = $("#toast");
  if (!t) return;
  t.textContent = msg;
  t.className = "toast" + (bad ? " bad" : "");
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.hidden = true; }, bad ? 8000 : 3000);
}

document.addEventListener("change", async (e) => {
  const sel = e.target.closest(".statussel"); if (!sel) return;
  const id = sel.dataset.statusFor, n = NODE.get(id); if (!n) return;
  const from = n.s ?? null, to = sel.value;
  if (to === from) return;

  sel.disabled = true;
  try {
    const res = await fetch(`/api/status/${encodeURIComponent(id)}?p=${APP.index}`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ from, status: to }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText || "write failed"}`);

    n.s = data.status;
    // The file on disk changed; its cached body still carries the old front
    // matter, and a peek or a re-open would render it.
    DOC_CACHE.delete(id);
    // Every pill wrapper showing this artifact — the canvas head and the
    // peek's, which can be the same artifact at once — recolours in place.
    document.querySelectorAll(`[data-status-wrap="${CSS.escape(id)}"]`).forEach((w) => {
      w.className = `statuswrap pill ${STATUS_PILL[n.s] || "dead"}`;
    });
    document.querySelectorAll(`.statussel[data-status-for="${CSS.escape(id)}"]`).forEach((o) => { o.value = n.s || ""; });
    // The navigator groups BY status, so the item has to move groups.
    renderNav();
    toast(`${id} → ${n.s}`);
  } catch (err) {
    sel.value = from ?? "";
    toast(`${id}: ${err.message}`, true);
  } finally {
    sel.disabled = false;
  }
});

/* ================= canvas ================= */
/* Bumped on every render dispatch; a stale async render (a doc fetch that
   resolves after the user has already navigated elsewhere) checks its own
   captured value against the current one before touching the DOM, and drops
   itself silently if the user has moved on. */
let renderGen = 0;

function renderCanvas() {
  const c = $("#canvas"), st = $("#subtabs");
  const gen = ++renderGen;
  if (selected && TYPES[section]) {
    st.hidden = false;
    st.innerHTML = (G.code?.present ? ["document", "links", "code", "graph"] : ["document", "links", "graph"]).map((k) =>
      `<button class="subtab" role="tab" data-sub="${k}" aria-selected="${k === subtab}" tabindex="${k === subtab ? 0 : -1}">${k}</button>`).join("");
    const n = NODE.get(selected);
    c.innerHTML = `<div class="pad"><div class="lab">Loading…</div></div>`;
    renderDoc(n).then((html) => {
      if (gen !== renderGen) return;
      c.innerHTML = html;
      if (subtab === "document") { renderNav(); applyHashJump(); renderMermaid(); }
      if (subtab === "graph") { requestAnimationFrame(() => { bindGraph(); focusNode(selected); }); }
    }).catch((e) => {
      if (gen !== renderGen) return;
      c.innerHTML = `<div class="pad"><div class="note"><strong>Render failed.</strong> ${esc(e.message)}</div></div>`;
    });
    return;
  }
  st.hidden = true;
  c.innerHTML = { overview: viewOverview, strategy: viewStrategy, system: viewSystem, cycle: viewCycle, graph: viewGraph, erd: viewERD, health: viewHealth }[section]?.() ?? viewList();
  if (section === "graph") requestAnimationFrame(() => { bindGraph(); resetGraph(); });
  if (section === "erd") drawERD();
  if (section === "system") renderMermaid();
}
/* Turns every `<pre class="mermaid">` the document's markdown just emitted
   into a diagram. Guarded for the no-vendor-script case (boot's stub DOM,
   or a future offline build). The vendored mermaid's run() is async — a
   malformed diagram rejects the returned promise rather than throwing
   synchronously, so the catch has to sit on the promise, not around the
   call. Either way, a bad diagram just stays as its source; it never breaks
   the page. */
function renderMermaid(scope) {
  if (!window.mermaid) return;
  const nodes = (scope || $("#canvas"))?.querySelectorAll("pre.mermaid") || [];
  if (!nodes.length) return;
  mermaid.run({ nodes }).catch(() => { /* a bad diagram stays as its source; never breaks the page */ });
}
$("#subtabs").addEventListener("click", (e) => {
  const b = e.target.closest(".subtab"); if (!b) return;
  subtab = b.dataset.sub; renderCanvas();
});
/* role="tablist" carries an expectation: Left/Right (and Home/End) move
 * selection, not just Tab. Roving tabindex (set alongside aria-selected
 * above) keeps the tab stop at exactly one button. */
$("#subtabs").addEventListener("keydown", (e) => {
  if (!["ArrowRight", "ArrowLeft", "Home", "End"].includes(e.key)) return;
  const tabs = [...document.querySelectorAll("#subtabs .subtab")];
  if (!tabs.length) return;
  const i = Math.max(0, tabs.findIndex((t) => t.getAttribute("aria-selected") === "true"));
  let next = i;
  if (e.key === "ArrowRight") next = (i + 1) % tabs.length;
  else if (e.key === "ArrowLeft") next = (i - 1 + tabs.length) % tabs.length;
  else if (e.key === "Home") next = 0;
  else if (e.key === "End") next = tabs.length - 1;
  e.preventDefault();
  subtab = tabs[next].dataset.sub; renderCanvas();
  requestAnimationFrame(() => document.querySelector(`#subtabs .subtab[data-sub="${subtab}"]`)?.focus());
});

/* ---- document ---- */
/* A document's file content is no longer embedded in the page (5a.1) — the
   graph carries only id/type/title/status/meta/path/byte-count for every
   node, so the initial payload stays small whether the corpus has 16
   artifacts or 40,000. The body is fetched from GET /api/doc/:id the moment
   a reader actually opens the document tab, and memoised per session so
   flipping between the links/graph/document sub-tabs never re-fetches. */
const DOC_CACHE = new Map();
async function fetchDoc(id) {
  if (DOC_CACHE.has(id)) return DOC_CACHE.get(id);
  const res = await fetch(`/api/doc/${encodeURIComponent(id)}`);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText || "fetch failed"}`);
  const text = await res.text();

/* ---- overview ---- */

/* Findings come from the checker — the same parse, with assertions — so the

const CHECK = G.check || { findings: [], bySeverity: { error: 0, warn: 0 }, notices: [], notRun: [] };

 * validates) and rule-5.5 field coverage exist at all — G.health.fieldCoverage
 * is only ever populated under it (extract/index.mjs). A head-block corpus
 * has neither, so every gates/coverage view below checks this once and falls

const FM_GRAMMAR = Object.keys(G.health.fieldCoverage || {}).length > 0;

/**
 * The four transition ratios: does an approved/done upstream artifact

 * is the "true health number" the funnel's raw done/total counts cannot show
 * — a stage can be 100% done and still have nothing validating any of it.

function computeGates() {
  const has = (id, rel, dir) => ((dir === "in" ? IN : OUT).get(id) || []).some(([, r]) => r === rel);

  const reqWithBP = approvedREQ.filter((n) => has(n.i, "satisfies", "in"));
  const approvedBP = G.nodes.filter((n) => n.y === "blueprint" && n.s === "approved");
  const bpWithWO = approvedBP.filter((n) => has(n.i, "implements", "in"));
  const doneWO = G.nodes.filter((n) => n.y === "work-order" && n.s === "done");
  const woWithTST = doneWO.filter((n) => has(n.i, "validates", "in"));
  const allTST = G.nodes.filter((n) => n.y === "validation");
  const passTST = allTST.filter((n) => n.s === "pass" || n.s === "pass-with-findings").length;
  const failTST = allTST.filter((n) => n.s === "fail").length;
  const unkTST = allTST.length - passTST - failTST;

    { g: "REQ → BP", num: reqWithBP.length, den: approvedREQ.length,
      why: approvedREQ.length - reqWithBP.length ? `${approvedREQ.length - reqWithBP.length} approved, no blueprint satisfies it` : "every approved REQ has a blueprint" },
    { g: "BP → WO", num: bpWithWO.length, den: approvedBP.length,
      why: approvedBP.length - bpWithWO.length ? `${approvedBP.length - bpWithWO.length} approved blueprints, no work order` : "every approved BP is cut into a WO" },
    { g: "WO → TST", num: woWithTST.length, den: doneWO.length,
      why: doneWO.length - woWithTST.length ? `${doneWO.length - woWithTST.length} done WOs carry no verdict` : "every done WO is validated" },

  const gates = computeGates();

    const tone = x.den === 0 ? "--dead" : pct === 1 ? "--ok" : pct >= 0.7 ? "--warn" : "--bad";
    return `<div class="gate"><div class="g">${esc(x.g)}</div>
      <div class="r" style="color:var(${tone})">${x.num}<small> / ${x.den}</small></div>

  for (const [f, t, r] of G.edges) {
