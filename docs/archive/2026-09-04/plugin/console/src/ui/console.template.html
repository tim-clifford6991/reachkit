    const blockedId = r === "blocked-by" ? f : t, blockerId = r === "blocked-by" ? t : f;
    if (seen.has(blockedId) || !NODE.has(blockedId)) continue;
    seen.add(blockedId);
    rows.push({ id: blockedId, detail: `blocked by ${idlink(blockerId)}` });
  }
  const latestTSTByWO = new Map();
  for (const [f, t, r] of G.edges) {
    if (r !== "validates") continue;
    (latestTSTByWO.get(t) || latestTSTByWO.set(t, []).get(t)).push(f);
  }
  for (const [woId, tstIds] of latestTSTByWO) {
    if (seen.has(woId)) continue;
    const latest = tstIds.slice().sort().pop(); // "-R2" sorts after "-R" sorts after the base id
    const tn = NODE.get(latest);
    if (tn && tn.s === "fail") {
      seen.add(woId);
      rows.push({ id: woId, detail: `latest verdict ${idlink(latest)} — fail` });
    }
  }
  return rows;
}
function blockersPanelHtml() {
  const rows = computeBlockers();
  return `<div class="panel" id="a-blockers"><div class="panel-head"><span class="lab">Blocking the pipeline</span>
    <span class="pill ${rows.length ? "bad" : "ok"}">${rows.length}</span></div>
    <div class="panel-body"><div class="risks">${rows.length
      ? rows.slice(0, 12).map((r) => { const n = NODE.get(r.id);
          return `<div class="risk" style="--s:var(--bad)"><span class="stripe"></span>
            <div><div class="h">${idlink(r.id)} ${esc((n?.t || "").slice(0, 44))}</div><div class="m">${r.detail}</div></div>
            <span class="pill bad">blocked</span></div>`; }).join("") + (rows.length > 12 ? `<div class="risk" style="--s:var(--dead)"><span class="stripe"></span><div><div class="m">+${rows.length - 12} more</div></div><span></span></div>` : "")
      : `<div class="risk" style="--s:var(--ok)"><span class="stripe"></span><div><div class="m">Nothing is declared blocked, and no work order's latest verdict is a fail.</div></div><span></span></div>`}
    </div></div></div>`;
}

/**
 * The code layer's drift findings — stale-blueprint, untraced-change,
 * done-without-commits — read together as one question repeated: which is
 * the source of truth, the code or the document? `idlink()` already renders
 * an artifact id as a jump button and a bare sha as `<code>`, which is
 * exactly the heading rule this panel needs, so it is reused rather than
 * reimplemented.
 */
function attentionPanelHtml() {
  if (!G.code?.present) {
    return `<div class="panel" id="a-attention"><div class="panel-head"><span class="lab">Attention</span>
      <span class="pill dead">0</span></div>
      <div class="panel-body"><div class="risks">${emptyRow("No repository connected (<code>code: null</code>, or not a git work tree).")}</div></div></div>`;
  }
  const findings = [...byRule("stale-blueprint"), ...byRule("untraced-change"), ...byRule("done-without-commits")];
  const anyError = findings.some((f) => f.severity === "error");
  const pill = findings.length ? (anyError ? "bad" : "warn") : "ok";
  return `<div class="panel" id="a-attention"><div class="panel-head"><span class="lab">Attention</span>
    <span class="pill ${pill}">${findings.length}</span></div>
    <div class="panel-body"><div class="risks">${findings.length
      ? findings.slice(0, 12).map((f) => `<div class="risk" style="--s:var(${f.severity === "error" ? "--bad" : "--warn"})"><span class="stripe"></span>
          <div><div class="h">${idlink(f.where)} ${esc(f.summary)}</div><div class="m">${esc(f.detail)}</div></div>
          <span class="pill ${f.severity === "error" ? "bad" : "warn"}">${esc(f.severity)}</span></div>`).join("") +
        (findings.length > 12 ? `<div class="risk" style="--s:var(--dead)"><span class="stripe"></span><div><div class="m">+${findings.length - 12} more</div></div><span></span></div>` : "")
      : `<div class="risk" style="--s:var(--ok)"><span class="stripe"></span><div><div class="m">Code and documents agree — nothing needs a decision.</div></div><span></span></div>`}
    </div></div></div>`;
}

/**
 * Rule 5.5: a generated index that is 2-of-409 populated must say so, not
 * render an empty-looking-healthy page. Cross-checks against the checker's
 * own silent-index findings (rather than re-guessing the threshold here) so
 * this meter and `--check` can never disagree about which fields are silent.
 */
function coveragePanelHtml() {
  const fc = Object.entries(G.health.fieldCoverage || {});
  if (!fc.length) return "";
  const silentFields = new Set(byRule("silent-index").map((f) => f.where));
  return `<div class="panel" id="a-coverage"><div class="panel-head"><span class="lab">Graph coverage</span><span class="pill dead">rule 5.5</span></div>
    <div class="panel-body">${fc.map(([field, { carrying, total }]) => {
      const pct = total ? Math.min(100, (carrying / total) * 100) : 0;
      const silent = silentFields.has(field);
      return `<div class="meter-row">
        <div class="m-top"><span class="f">${esc(field)}</span><span class="n">${carrying} / ${total}${silent ? " · silent" : ""}</span></div>
        <div class="meter"><span style="flex:${pct};background:var(${silent ? "--bad" : "--accent"})"></span><span style="flex:${100 - pct}"></span></div>
      </div>`;
    }).join("")}</div></div>`;
}

function viewOverview() {
  // G.counts / G.status are keyed by TYPES[id].key, not the id itself —
  // under front-matter grammar the two differ ("requirement" vs "REQ"), and
  // a type retired under that grammar (key: null) has a real, structural
  // zero rather than a lookup that happens to miss.
  const tiles = G.types.map((t) => {
    const key = TYPES[t.id]?.key;
    return tile(t.id, t.label, (key && G.counts[key]) || 0, (key && G.status[key]) || {}, t.shape === "table" ? "--warn" : "--accent");
  }).join("");

  /* The pipeline is whatever chain of file-shaped types the project declares;
     the last one's terminal status is what "shipped" means. Kept as the
     head-block grammar's whole gates story (no typed edges to build a real
     transition ratio from), and shown alongside the gates row under
     front-matter too — done/total is still worth seeing even once the
     transition ratios exist. */
  const flow = G.types.filter((t) => t.shape === "dir" && TYPES[t.id]?.key && G.counts[TYPES[t.id].key]);
  const funnelRows = flow.map((t) => {
    const key = TYPES[t.id].key;
    const s = G.status[key] || {};
    const done = (s.done || 0) + (s.approved || 0) + (s.accepted || 0) + (s.resolved || 0);
    return [t.label, done, G.counts[key], t.id === "WO" ? "--accent" : "--ok"];
  });
  const funnelHtml = `<div class="panel" id="a-funnel"><div class="panel-head"><span class="lab">Pipeline throughput</span><span class="pill acc">done / total</span></div>
    <div class="panel-body"><div class="funnel">${funnelRows.map(([l, v, t, c]) => `<div class="stage">
      <span class="lab">${l}</span><div class="bar"><span style="flex:${v};background:var(${c})"></span><span style="flex:${t - v};background:var(--surface-2)"></span></div>
      <span class="n">${v}/${t}</span></div>`).join("")}</div></div></div>`;

  const errs = CHECK.bySeverity.error || 0, warns = CHECK.bySeverity.warn || 0;
  const conformanceLine = `<div class="note" style="margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span class="pill ${errs ? "bad" : warns ? "warn" : "ok"}">${CHECK.findings.length} findings</span>
    <span><strong>${errs} error${errs === 1 ? "" : "s"} · ${warns} warn${warns === 1 ? "" : "s"}</strong> from conformance checking — dangling ids, vocabulary drift, and the rest of the ${APP.rules.length} rules.</span>
    <button class="idref" type="button" data-sec="health" style="margin-left:auto">View in Health →</button>
  </div>`;

  return `<div class="pad">
    <div id="a-tiles" class="tiles">${tiles}</div>
    ${conformanceLine}
    ${FM_GRAMMAR ? `<div style="margin-top:14px">${gatesRowHtml()}</div>` : ""}
    <div class="cols" style="margin-top:${FM_GRAMMAR ? "0" : "14px"}">
      ${FM_GRAMMAR ? "" : funnelHtml}
      ${blockersPanelHtml()}
      ${attentionPanelHtml()}
      ${FM_GRAMMAR ? coveragePanelHtml() : ""}
    </div>
    <div class="note"><strong>Nothing here is stored.</strong> The console holds no database — it re-reads
    <code>${esc(APP.docsRoot)}</code>${APP.schemaPath ? ` and <code>${esc(APP.schemaPath)}</code>` : ""} and rebuilds the graph
    from declared link lines only. It cannot drift from the corpus, because it is never a copy of it. It also never writes:
    agents remain the only writers.</div></div>`;
}
$("#canvas").addEventListener("click", (e) => {
  const t = e.target.closest(".tile[data-sec]"); if (t) return go(t.dataset.sec, null);
  const h = e.target.closest("[data-sec]"); if (h) go(h.dataset.sec, null);
});

/* ---- strategy ---- */
function viewStrategy() {
  const kids = new Map();
  for (const [f, t, r] of G.edges) if (r === "parent") (kids.get(t) || kids.set(t, []).get(t)).push(f);
  /* Whichever type actually declares `parent` is the hierarchy — not a
     hardcoded BP, so a project that names its blueprints something else
     still gets its tree. */
  const hierTally = {};
  for (const [f, , r] of G.edges) if (r === "parent") { const n = NODE.get(f); if (n) hierTally[n.y] = (hierTally[n.y] || 0) + 1; }
  const hierType = Object.entries(hierTally).sort((a, b) => b[1] - a[1])[0]?.[0];
  const roots = hierType
    ? G.nodes.filter((n) => n.y === hierType && !(OUT.get(n.i) || []).some(([, r]) => r === "parent"))
    : [];
  const tree = (id, d) => {
    const n = NODE.get(id); if (!n || d > 2) return "";
    const ch = (kids.get(id) || []).sort();
    return `<li><button class="idref" data-goto="${esc(id)}">${esc(id)}</button> ${esc((n.t || "").slice(0, 60))}
      ${ch.length ? `<ul>${ch.map((c) => tree(c, d + 1)).join("")}</ul>` : ""}</li>`;
  };
  return `<div class="pad">
    <div class="cols" style="grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)">
      <div class="panel" id="a-charter"><div class="panel-head"><span class="lab">Project charter</span><span class="pill acc">${esc(APP.charter)}</span></div>
        <div class="prose" style="padding:16px 18px 22px;max-width:none">${G.charter ? md(G.charter) :
          `<p>No charter at <code>${esc(APP.docsRoot)}/${esc(APP.charter)}</code>. Run <code>/codebase-scan</code> for an existing codebase, or <code>/require</code> for a new one.</p>`}</div></div>
      <div>
        <div class="panel" id="a-modules"><div class="panel-head"><span class="lab">Module map</span><span class="pill dead">${G.modules.length} rows</span></div>
          <div class="tw" style="border:0;border-radius:0;max-height:420px"><table class="grid modtable" style="min-width:0">
            <thead><tr><th>Path</th><th>Responsibility</th><th>Owner</th></tr></thead>
            <tbody>${G.modules.map((m) => `<tr><td>${esc(m.path)}</td><td>${esc((m.resp || "").slice(0, 120))}</td>
              <td class="dep">${inline((m.bp || "").slice(0, 60))}</td></tr>`).join("")}</tbody></table></div></div>
        <div class="panel" id="a-tree" style="margin-top:12px"><div class="panel-head"><span class="lab">${esc(TYPES[hierType]?.name || "Hierarchy")}</span>
          <span class="pill dead">${roots.length} roots</span></div>
          <div class="panel-body prose" style="max-width:none">${roots.length
            ? `<ul>${roots.slice(0, 14).map((r) => tree(r.i, 0)).join("")}</ul>`
            : `<p>Nothing declares a <code>Parent:</code> line yet, so there is no hierarchy to draw.</p>`}</div></div>
      </div>
    </div>
    <div class="note"><strong>This is the steering view.</strong> The charter states intent, the module map is the only
    authority on where code lives (<code>${esc(APP.structureMap)}</code>, rule 9a), and the hierarchy shows which node
    owns which capability. Drift between these three is how a factory quietly stops being one.</div></div>`;
}

/* ---- system ---- */
/* A mermaid node label must not carry a literal double quote — it breaks
 * mermaid's own `["..."]` syntax — so `"` is rewritten to `#quot;` (mermaid's
 * bare-entity escape, no ampersand) before the text goes through esc() for
 * the surrounding HTML. Kept under ~60 chars so a long step doesn't blow out
 * the diagram's width. */
function mermaidLabel(s) {
  let t = String(s ?? "");
  if (t.length > 60) t = t.slice(0, 59) + "…";
  return esc(t.replace(/"/g, "#quot;"));
}
/* One journey's flow: a `flowchart LR` chain, one node per step, followed by
 * a step table (#, step, requirements it exercises). Shared verbatim by
 * viewSystem() (one per journey, in a panel) and renderDoc() (above a
 * journey document's own body) so the two never drift apart. */
function journeyFlow(id) {
  const j = G.journeys?.[id];
  if (!j) return "";
  const steps = j.steps || [];
  const diagram = steps.length
    ? `<pre class="mermaid">flowchart LR\n  ${steps.map((s, i) => `S${i + 1}["${mermaidLabel(s.step)}"]`).join(" --> ")}</pre>`
    : "";
  const table = `<div class="tw"><table class="grid">
    <thead><tr><th>#</th><th>Step</th><th>Requirements</th></tr></thead>
    <tbody>${steps.map((s, i) => `<tr><td>${i + 1}</td><td>${esc(s.step)}</td>
      <td>${s.exercises.length ? s.exercises.map(idlink).join(" ") : '<span class="pill dead">no requirement</span>'}</td></tr>`).join("")}</tbody>
  </table></div>`;
  return diagram + table;
}
function viewSystem() {
  const ids = Object.keys(G.journeys || {}).sort();
  if (!ids.length) {
    return `<div class="pad"><div class="note">No journeys yet — requirement-off-journey cannot run; write the first with /require or the journey-writing skill.</div></div>`;
  }
  const panels = ids.map((id) => {
    const n = NODE.get(id);
    const j = G.journeys[id];
    return `<div class="panel" style="margin-bottom:12px"><div class="panel-head">
      <span class="lab">${idlink(id)} · ${esc(n?.t || "")} · ${esc(j.persona || "no persona")}</span></div>
      <div class="panel-body">${journeyFlow(id)}</div></div>`;
  }).join("");

  // Computed straight from G.nodes + G.edges (the graph itself), not from
  // CHECK.findings — requirement-off-journey's own severity in
  // factory.config.json can be turned to "off" without emptying this panel.
  // A rule being disabled silences the *finding*, not the fact it would
  // have reported; the Gaps panel is that fact, read independently.
  const exercisedIds = new Set(G.edges.filter(([, , r]) => r === "exercises").map(([, t]) => t));
  const gapReqs = G.nodes.filter((n) => n.y === "requirement" && n.s === "approved" && !exercisedIds.has(n.i)).map((n) => n.i);
  const gapSteps = [];
  for (const id of ids) (G.journeys[id].steps || []).forEach((s, i) => {
    if (!s.exercises.length) gapSteps.push(`${esc(id)} · step ${i + 1}`);
  });
  const gaps = `<div class="panel" id="a-gaps"><div class="panel-head"><span class="lab">Gaps</span></div>
    <div class="panel-body">
      <div class="note"><strong>Approved requirements on no journey.</strong> ${gapReqs.length ? gapReqs.map(idlink).join(" ") : "None."}</div>
      <div class="note" style="margin-top:8px"><strong>Steps exercising nothing.</strong> ${gapSteps.length ? gapSteps.join(" · ") : "None."}</div>
    </div></div>`;

  return `<div class="pad">${panels}${gaps}</div>`;
}

/* ---- cycle ---- */
/* The "what's next" view (WS4): the current open wave's board, grouped by
 * status, and per-feature completion derived from the code spine — never
 * from the wave row's own status text, which is exactly what makes this
 * different from just re-printing registry/waves.md. `G.waves` is Task 3's
 * shape: { current: "W1"|null, list: [{ id, goal, wos, priorities, status }] }.
 * A WO id the wave names but the corpus has no node for (wave-off-record's
 * own case (b)) still needs a row — dropping it silently would make the
 * board look more complete than the corpus actually is.
 *
 * Completion ruling: a work order counts as done when its own status is
 * `done` AND — whenever a code layer is connected (`G.code?.present`) — at
 * least one commit names it (`G.code.commits[].wo`). With no repository
 * connected there is no spine to check against, so completion falls back to
 * status alone. See `cycleWoDone()`. */
const CYCLE_PRIORITY_PILL = { Must: "bad", Should: "warn", Could: "dead", "Won't": "dead" };
const CYCLE_COLS = [["draft", "Draft"], ["approved", "Approved"], ["in-review", "In review"], ["done", "Done"]];
function cycleWoDone(id) {
  const n = NODE.get(id);
  if (!n || n.s !== "done") return false;
  if (!G.code?.present) return true;
  return G.code.commits.some((c) => (c.wo || []).includes(id));
}
function cycleWoRow(id, priorities) {
  const n = NODE.get(id);
  if (!n) return `<div class="risk" style="--s:var(--dead)"><span class="stripe"></span>
    <div><div class="h">${esc(id)} — no artifact</div></div><span class="pill dead">missing</span></div>`;
  const p = priorities[id];
  return `<div class="risk" style="--s:var(${SEGV[n.s] || "--dead"})"><span class="stripe"></span>
    <div><div class="h">${idlink(id)} ${esc((n.t || "").slice(0, 54))}</div></div>
    ${p ? `<span class="pill ${CYCLE_PRIORITY_PILL[p] || "dead"}">${esc(p)}</span>` : "<span></span>"}</div>`;
}
/* Requirements the wave's own work orders reach through `implements` — a
 * direct REQ target, or a BP target whose own `satisfies` names one (never
 * `covers`, rule 5.4's "true but not an authorising ancestor" distinction).
 * `m` is the wave's WOs that reach a requirement this way; `n` is however
 * many of those are `done` — the fraction that answers "is this feature
 * actually shipped", not "does the wave say so". */
function cycleReqCompletion(waveWoIds) {
  const reqWos = new Map();
  for (const woId of waveWoIds) {
    for (const [t, r] of (OUT.get(woId) || [])) {
      if (r !== "implements") continue;
      const tn = NODE.get(t);
      if (!tn) continue;
      if (tn.y === "requirement") (reqWos.get(t) || reqWos.set(t, new Set()).get(t)).add(woId);
      else if (tn.y === "blueprint") {
        for (const [t2, r2] of (OUT.get(t) || [])) {
          if (r2 !== "satisfies") continue;
          const rn = NODE.get(t2);
          if (rn?.y === "requirement") (reqWos.get(t2) || reqWos.set(t2, new Set()).get(t2)).add(woId);
        }
      }
    }
  }
  return reqWos;
}
/* Shared by both of viewCycle()'s branches: a wave with everything closed
 * (no open row at all, so `waves.current` is null) must still show its
 * closed history — an owner who just closed the only wave should not read
 * that as "the board forgot everything before now". */
function cycleClosedWavesHtml(waves) {
  const closedRows = waves.list.filter((w) => w.status !== "open");
  if (!closedRows.length) return "";
  return `<div class="note" style="margin-top:12px">Closed: ${closedRows.map((w) => {
    const ct = w.wos.length, cd = w.wos.filter(cycleWoDone).length;
    return `${esc(w.id)} (${cd}/${ct})`;
  }).join(", ")}</div>`;
}
function viewCycle() {
  const waves = G.waves || { current: null, list: [] };
  if (!waves.current) {
    // Not itself an artifact type (Task 3), so an empty registry/waves.md is
    // the same "notice, not a rule" posture wave-off-record takes — read the
    // exact sentence back from CHECK.notices rather than restating it here,
    // so the two can never drift apart.
    const notice = (!waves.list.length && FM_GRAMMAR)
      ? (CHECK.notices || []).find((t) => t.startsWith("No registry/waves.md"))
      : null;
    return `<div class="pad"><div class="empty"><div class="lab">No open wave.</div>
      <p>/wave propose writes the first one.</p>
      ${notice ? `<p>${esc(notice)}</p>` : ""}</div>
      ${cycleClosedWavesHtml(waves)}</div>`;
  }

  const row = waves.list.find((w) => w.id === waves.current) || { id: waves.current, goal: "", wos: [], priorities: {} };
  const total = row.wos.length;
  const done = row.wos.filter(cycleWoDone).length;

  const knownCols = new Set(CYCLE_COLS.map(([key]) => key));
  const buckets = {};
  const missing = [];
  for (const id of row.wos) {
    const n = NODE.get(id);
    if (!n) { missing.push(id); continue; }
    (buckets[n.s] ||= []).push(id);
  }
  const colHtml = CYCLE_COLS.map(([key, label]) => {
    const ids = buckets[key] || [];
    return `<div class="panel"><div class="panel-head"><span class="lab">${esc(label)}</span><span class="pill dead">${ids.length}</span></div>
      <div class="panel-body"><div class="risks">${ids.length ? ids.map((id) => cycleWoRow(id, row.priorities)).join("") : emptyRow("Nothing here.")}</div></div></div>`;
  }).join("");
  // A status this corpus's grammar carries but CYCLE_COLS doesn't name
  // (e.g. `superseded`) still needs a row — `total` above already counts
  // it, so this column only changes where it's shown, never the fraction.
  const otherIds = Object.entries(buckets).filter(([key]) => !knownCols.has(key)).flatMap(([, ids]) => ids);
  const otherHtml = otherIds.length
    ? `<div class="panel"><div class="panel-head"><span class="lab">Retired / other</span><span class="pill dead">${otherIds.length}</span></div>
        <div class="panel-body"><div class="risks">${otherIds.map((id) => cycleWoRow(id, row.priorities)).join("")}</div></div></div>`
    : "";
  const missingHtml = missing.length
    ? `<div class="panel"><div class="panel-head"><span class="lab">No artifact</span><span class="pill dead">${missing.length}</span></div>
        <div class="panel-body"><div class="risks">${missing.map((id) => cycleWoRow(id, row.priorities)).join("")}</div></div></div>`
    : "";

  const reqWos = cycleReqCompletion(row.wos.filter((id) => NODE.has(id)));
  const reqIds = [...reqWos.keys()].sort();
  const completionHtml = reqIds.length
    ? reqIds.map((reqId) => {
        const woSet = reqWos.get(reqId);
        const rTotal = woSet.size;
        const rDone = [...woSet].filter(cycleWoDone).length;
        const pct = rTotal ? (rDone / rTotal) * 100 : 0;
        const rn = NODE.get(reqId);
        return `<div class="meter-row">
          <div class="m-top"><span class="f">${idlink(reqId)} · ${esc(rn?.t || "")}</span><span class="n">${rDone}/${rTotal}</span></div>
          <div class="meter"><span style="flex:${pct};background:var(--ok)"></span><span style="flex:${100 - pct}"></span></div>
        </div>`;
      }).join("")
    : `<div class="note">No requirement is reached yet from this wave's work orders.</div>`;

  return `<div class="pad">
    <div class="panel" id="a-cycle-head"><div class="panel-head">
      <span class="lab">${esc(row.id)} · ${esc(row.goal || "")}</span>
      <span class="pill acc">${done}/${total} done</span></div></div>
    <div class="cols" style="margin-top:12px">${colHtml}${otherHtml}${missingHtml}</div>
    <div class="panel" id="a-cycle-completion" style="margin-top:12px"><div class="panel-head">
      <span class="lab">Per-feature completion</span><span class="pill dead">${reqIds.length}</span></div>
      <div class="panel-body">${completionHtml}</div></div>
    ${cycleClosedWavesHtml(waves)}
  </div>`;
}

/* ---- graph ---- */
/* The ten canonical edge kinds (front-matter's FM_EDGE_FIELDS, plus

      <span class="lab">Truth · parsed from ${esc(APP.schemaPath || "migrations")}</span><span style="flex:1"></span>
      <span class="stamp">${G.tables.length} tables · ${G.tables.reduce((a, t) => a + t.c.length, 0)} columns · ${G.tables.reduce((a, t) => a + t.c.filter((c) => c.f).length, 0)} foreign keys</span></div>
    <div class="erd-wrap" id="a-diagram"><svg id="erd" viewBox="0 0 ${width} ${height}" role="img" aria-label="Entity relationship diagram"></svg></div>
    <div class="note"><strong>Generated from <code>create table</code> statements</strong> across the migration files —
    names, columns, primary keys and foreign keys. A later wave renders a second ERD from the
    <code>## Data model delta</code> sections in the blueprints and diffs the two: schema drift, surfaced automatically.</div></div>`;
}
function drawERD() {
  const svg = document.getElementById("erd"); if (!svg) return;
  const EPOS = erdPositions().pos;
  const boxes = {}, parts = [], rels = [];
  for (const t of G.tables) {
    const [x, y] = EPOS[t.n] || [ERD_X0, ERD_Y0];
    const shown = t.c.slice(0, 6), h = 26 + shown.length * 15 + (t.c.length > 6 ? 14 : 0);
    boxes[t.n] = { x, y, w: 160, h: h + 24 };
    parts.push(`<rect x="${x}" y="${y}" width="160" height="24" rx="4" fill="var(--accent-wash)" stroke="var(--line-strong)"/>
      <rect x="${x}" y="${y + 24}" width="160" height="${h}" fill="var(--paper)" stroke="var(--line-strong)"/>
      <text x="${x + 11}" y="${y + 17}" font-family="ui-monospace,Menlo,monospace" font-size="11" font-weight="600" fill="var(--ink)">${t.n}</text>` +
      shown.map((c, i) => `<text x="${x + 11}" y="${y + 42 + i * 15}" font-family="ui-monospace,Menlo,monospace" font-size="9.5" fill="${c.p || c.f ? "var(--accent)" : "var(--muted)"}">${c.n}${c.p ? " · PK" : c.f ? ` → ${c.f}` : ""}</text>`).join("") +
      (t.c.length > 6 ? `<text x="${x + 11}" y="${y + 42 + shown.length * 15}" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="var(--faint)">+${t.c.length - 6} more</text>` : ""));
  }
  for (const t of G.tables) for (const c of t.c) {
    if (!c.f || !boxes[c.f] || !boxes[t.n]) continue;
    const a = boxes[c.f], b = boxes[t.n];
    const d = a.y === b.y ? `M${a.x + 160} ${a.y + 46} H${b.x}` : `M${a.x + 80} ${a.y + a.h} V${b.y + 46} H${b.x}`;
    rels.push(`<path d="${d}" fill="none" stroke="var(--line-strong)" stroke-width="1.2"/>
      <text x="${a.y === b.y ? (a.x + 160 + b.x) / 2 - 12 : a.x + 88}" y="${a.y === b.y ? a.y + 40 : b.y + 40}" font-family="ui-monospace,Menlo,monospace" font-size="9" fill="var(--muted)">1 : n</text>`);
  }
  svg.innerHTML = rels.join("") + parts.join("");
}

/* ---- health ---- */
/* Exactly what `--check` prints, rendered. The checker is the same parse with
   assertions, so this view and the CI run cannot disagree. */
function viewHealth() {
  const rules = APP.rules;
  const notRun = new Set(CHECK.notRun || []);
  const rows = rules.map((rule) => {
    const fs = byRule(rule.id);
    // A rule this pass could not run at all (no journeys yet for
    // requirement-off-journey, no graph.json for generated-drift) is not
    // the same as a rule that ran and found nothing — rendering it green
    // "Clean." would say the corpus was checked when it never was.
    const skipped = rule.severity !== "off" && notRun.has(rule.id);
    const sev = rule.severity === "off" || skipped ? "--dead" : fs.length === 0 ? "--ok" : fs[0].severity === "error" ? "--bad" : "--warn";
    const detail = rule.severity === "off"
      ? `Disabled in <code>factory.config.json</code>. Nothing was checked.`
      : skipped
        ? `Could not run — see notices.`
        : fs.length === 0
          ? `Clean. ${esc(rule.text)}.`
          : fs.slice(0, 6).map((f) => `<div>${f.where && NODE.has(f.where) ? idlink(f.where) + " " : ""}${esc(f.summary)}${f.detail ? ` — <span style="color:var(--faint)">${esc(f.detail)}</span>` : ""}</div>`).join("") +
            (fs.length > 6 ? `<div style="color:var(--faint)">+${fs.length - 6} more</div>` : "");
    const pill = rule.severity === "off" ? rule.severity : skipped ? "not run" : rule.severity;
    return [sev, fs.length, rule.id, detail, pill];
  });

  const notices = CHECK.notices || [];
  return `<div class="pad"><div class="health" id="a-all">${rows.map(([s, n, h, m, p]) => `<div class="hrow" style="--s:var(${s})">
    <span class="stripe"></span><span class="n">${n}</span><div><div class="h">${esc(h)}</div><div class="m">${m}</div></div>
    <span class="pill ${s === "--bad" ? "bad" : s === "--warn" ? "warn" : s === "--ok" ? "ok" : "dead"}">${esc(p)}</span></div>`).join("")}</div>
    ${notices.length ? `<div class="panel" style="margin-top:12px"><div class="panel-head"><span class="lab">Notices — not rules</span>
      <span class="pill dead">${notices.length}</span></div><div class="panel-body"><div class="risks">${notices.map((t) =>
      `<div class="risk" style="--s:var(--dead)"><span class="stripe"></span><div><div class="m">${esc(t)}</div></div><span></span></div>`).join("")}</div></div></div>` : ""}
    <div class="note"><strong>${rules.length} checks nobody runs by hand across ${G.counts.total} artifacts.</strong>
    This is the same run as <code>npx factory-console --check</code>, which exits 1 on an
    <code>error</code>-severity finding — ${CHECK.bySeverity.error} here, and ${CHECK.bySeverity.warn} at
    <code>warn</code>. Severity is per-rule in <code>factory.config.json</code>, so a corpus with a real history can adopt
    the checker before it is clean and ratchet rules up as it fixes them.</div></div>`;
}

/* ---- boot ---- */
/* No window resize listener: the graph canvas's own ResizeObserver (bound in
   bindGraph()) already reacts to a window resize, since that's exactly what
   changes the canvas's box size. Both listeners now also drop the resolved
   CSS-variable cache (work item 5b) — the canvas's own palette otherwise
   keeps painting the theme it booted under after a toggle or an OS-level
   scheme change. */
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { paletteCache.clear(); draw(); if (section === "erd") drawERD(); });
new MutationObserver(() => { paletteCache.clear(); draw(); if (section === "erd") drawERD(); })
  .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

/* Test-only hook: a boot-style stub DOM has no click path into a sub-tab
   button (its querySelectorAll returns nothing), so committed coverage of
   the code sub-tab and the Attention panel drives navigation directly
   through this instead. Guarded on APP existing — always true once the
   server has injected it — so this reads as deliberately test-only rather
   than a stray global left in the shipped page. */
if (typeof APP !== "undefined") {
  window.__factoryTest = { go, setSubtab: (v) => { subtab = v; } };
}

// A hash present on load (a pasted deep link, or a reload after navigating)
// restores that exact view instead of always booting to Overview.
//
// Every corpus shares one id space — REQ-005 exists in reachkit.app AND in
// timclifford.dev, as two different artifacts. A `.ptab` tab switch is a
// real navigation to `?p=…` with no hash of its own (dropped by ordinary URL
// resolution the moment the target has no fragment), but a hash can still
// reach a boot of the WRONG project by other paths — a bookmarked
// `?p=1#REQ/REQ-005`, a pasted link, the Back button crossing a tab switch —
// and honoring it unconditionally would resolve REQ-005 silently against
// whichever artifact THIS corpus happens to have at that id (dogfood F5,
// compounding factor (b)). Requiring the id to actually be in this corpus's
// own NODE map before honoring it closes that regardless of how the hash
// arrived; anything else lands cleanly on Overview instead.
const bootHash = parseHash();
const bootType = bootHash && (TYPES[bootHash.sec] || VIEWS[bootHash.sec]);
const bootKnown = bootType && (!bootHash.id || NODE.has(bootHash.id));
if (bootKnown) go(bootHash.sec, bootHash.id, { fromHash: true });
else go("overview", null);
</script>
